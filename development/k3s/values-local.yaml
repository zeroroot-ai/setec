# Setec chart overlay for the local single-node k3s dev cluster.
#
# Every override below is annotated with the reason for the deviation from
# the chart's defaults. Production deployments use SPIRE for TLS material,
# multi-node sandbox pools with taints, and a real LoadBalancer/Ingress —
# none of which apply on a single-node dev box.

# Run images built from the WORKING TREE, not GHCR release tags. Build
# locally and import into k3s:
#   for c in manager frontend node-agent setec-device-plugin; do
#     img=ghcr.io/zeroroot-ai/setec-${c#setec-}; [ "$c" = manager ] && img=ghcr.io/zeroroot-ai/setec
#     docker build --build-arg CMD=$c -t $img:dev .
#   done
#   docker build -f Dockerfile.launcher $(sed 's/^/--build-arg /' firecracker.env | grep -v '^--build-arg #') \
#     -t ghcr.io/zeroroot-ai/setec-launcher:dev .
#   docker build -f Dockerfile.disk-builder -t ghcr.io/zeroroot-ai/setec-disk-builder:dev .
#   docker save ...:dev | sudo k3s ctr -n k8s.io images import -
# pullPolicy: Never forces the locally-loaded image and fails loud
# (ErrImageNeverPull) if an import was missed — never silently pulls a
# stale/absent :dev from GHCR.
image:
  tag: "dev"
  pullPolicy: Never

frontend:
  # The chart defaults frontend.enabled to false (production deployments
  # may run the operator without exposing a gRPC API). Dev always wants
  # the frontend — it's the Setec product surface.
  enabled: true
  image:
    tag: "dev"
    pullPolicy: Never
  # The one enrolled client of dev. 35-mint-client-svid.sh mints an SVID
  # for this SPIFFE ID, and the smoke scripts dial with it.
  clients:
    - name: dev
      spiffeID: spiffe://dev.local/ns/gibson/sa/gibson-daemon


  # Single-node dev sizing — keep memory low so the node has headroom for
  # operator + sandbox workloads on the same host.
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Standard listen + service ports. NodePort exposure is bolted on via a
  # sibling Service (manifests/setec-nodeport.yaml) because the chart does
  # not template a NodePort field today.
  listenAddr: ":50051"
  servicePort: 50051

operator:
  # Single-node dev: the operator co-locates with the sandbox workloads on
  # the only node (no taint isolation). Production uses a separate system
  # pool with sandbox-pool taint tolerations.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

nodeAgent:
  # Dev cluster runs node-agent everywhere (DaemonSet default).
  enabled: true
  image:
    tag: "dev"
    pullPolicy: Never

# The launcher runtime runs the working-tree build too. 40-install-setec.sh
# sets launcher.diskRepo (the registry of 20-install-disk-registry.sh) and
# the disk signing key.
launcher:
  image:
    tag: "dev"
  diskBuilder:
    image:
      tag: "dev"

devicePlugin:
  image:
    tag: "dev"
    pullPolicy: Never

# The one credential source of setec is the SPIFFE Workload API
# (setec#175). 30-install-spire.sh installs SPIRE with the trust domain
# dev.local. Its agent serves the Workload API at this socket on the node.
credentials:
  spiffe:
    socketPath: /run/spire/agent-sockets/spire-agent.sock
    trustDomain: dev.local

# The dev frontend takes calls from the Kind gibson cluster on the same host,
# through a NodePort on the host LAN address. Those calls come from outside
# this cluster, so the caller is an address range, not a Pod. mTLS with the
# enrolled dev client still gates each call.
systemPolicy:
  frontendCallers:
    - cidr: 0.0.0.0/0
