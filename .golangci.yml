# Shared golangci-lint v2 baseline — adopted from
# zeroroot-ai/.github/templates/golangci-base.yml (slice 2.2, gibson#172).
# Linter set lives in the base; per-repo section below is the only place
# to add repo-specific exclusions.

version: "2"

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    # --- base set (zeroroot-ai/.github/templates/golangci-base.yml) ---
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused
    - exhaustive
    - gosec
    - errorlint
    - wrapcheck
    - nilerr
    - contextcheck
    - fatcontext
    # depguard disabled — requires explicit rules config to avoid blocking
    # all third-party imports; see zeroroot-ai/.github#93 for the org-level fix.
    - gocritic
    - revive
    - gocyclo
    - prealloc
    - dupl
    - copyloopvar
    - gocheckcompilerdirectives
    - intrange
    - mirror
    - perfsprint
    - sloglint
    - testifylint
    - thelper
    - usestdlibvars
    - whitespace

    # --- per-repo additions (kubebuilder / controller-runtime conventions) ---
    - ginkgolinter  # Ginkgo/Gomega test idioms
    - lll           # line-length for API types
    - modernize     # newer stdlib idioms; autofixable
    - misspell      # spelling
    - nakedret      # naked return
    - unconvert     # redundant conversions
    - unparam       # unused params
    - goconst       # repeated literals; see settings.goconst below

  settings:
    goconst:
      # ignore-tests, not 216 named constants. Measured on this tree with
      # v2.14.0: 216 findings, 212 of them in _test.go and 4 in production.
      # A repeated literal in a table-driven test case reads better inline
      # than behind a constant, and the 4 production findings are fixed
      # either way, so the 212 buy no coverage (#118).
      ignore-tests: true
    staticcheck:
      checks: ["all"]
    gosec:
      severity: medium
    wrapcheck:
      # A gRPC handler returns a status error as is: a wrap hides its code
      # from the client. An error of a setec package already names its
      # step. The default signatures stay in the list.
      extra-ignore-sigs:
        - google.golang.org/grpc/status.Error(
        - google.golang.org/grpc/status.Errorf(
        - sigs.k8s.io/controller-runtime/pkg/client.IgnoreNotFound(
      ignore-package-globs:
        - github.com/zeroroot-ai/setec/*
    exhaustive:
      # A default case handles the values that it does not name.
      default-signifies-exhaustive: true
      check: [switch]
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 150
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks: [hugeParam, rangeValCopy]
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero

  exclusions:
    generated: lax
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
      - "zz_generated.*\\.go$"
      - "api/gen/.*"
      - third_party$
      - builtin$
      - examples$
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # A test returns its errors to the test itself, which needs no
      # context added on the way.
      - linters:
          - wrapcheck
        path: _test\.go$
      # A test reads and writes files that it made in its own temp
      # directory, with the modes that the test needs.
      - linters:
          - gosec
        path: _test\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$

# allowlist:
# Per-repo opt-outs with TODO referencing the follow-up issue.
#
# depguard: disabled — requires explicit rules config. See zeroroot-ai/.github#93.

