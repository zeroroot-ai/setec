# An ephemeral Sandbox (ADR-0146): it runs one command to the end, and the
# operator deletes it after the command exits or the timeout passes. It has
# no network access.
apiVersion: setec.zeroroot.ai/v1alpha1
kind: Sandbox
metadata:
  name: sandbox-sample
spec:
  image: docker.io/library/busybox:1.36
  command:
    - /bin/sh
    - -c
    - "echo hello from the sandbox"
  resources:
    vcpu: 1
    memory: 256Mi
  network:
    mode: none
  lifecycle:
    timeout: 10m
