version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /examples/ai-code-exec
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - examples

  - package-ecosystem: gomod
    directory: /examples/ci-sandbox
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - examples
    # grpc v1.84.0 is newer than v1.83.2 and is also inside a later affected
    # range of GO-2026-6443, so #81's "bump to the latest" walked back into the
    # advisory. The ignore names the one affected release, so it lifts itself
    # when v1.84.1 or v1.85.0 ships. `direct-require-advisories` catches it
    # either way (setec#97).
    ignore:
      - dependency-name: google.golang.org/grpc
        versions:
          - 1.84.0

  - package-ecosystem: gomod
    directory: /examples/sec-research
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - examples

  - package-ecosystem: gomod
    directory: /hack/lintconfig
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - go
      - ci

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      actions:
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
