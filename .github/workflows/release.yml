# Tag-driven release workflow for Setec.
#
# Image builds have moved to images.yml (org reusable, slice 1.2, .github#47).
# This workflow handles the draft GitHub Release.
#
# Triggers on semver-shaped tag pushes (v* — including pre-releases like
# v0.1.0-alpha.1).

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  draft-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Create or update draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
