# The guest kernel of a launcher machine (setec#191).
#
#   pull_request / merge_group, kernel/** or the script changed: the config
#     check only (a few seconds, no build).
#   push of a release tag v*: build vmlinux from kernel/kernel.env, sign it
#     with cosign (keyless, the OIDC identity of this workflow), and attach
#     vmlinux, vmlinux.config, SHA256SUMS and the signature bundle to the
#     GitHub release of the tag.
#   workflow_dispatch: the build, uploaded as a workflow artifact.
name: guest-kernel

on:
  pull_request:
    paths: ["kernel/**", "scripts/build-guest-kernel.sh", ".github/workflows/guest-kernel.yml"]
  merge_group:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  config-check:
    name: The guest kernel config is minimal
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch the pinned kernel source and check the config
        run: |
          set -euo pipefail
          . kernel/kernel.env
          work="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$work/linux.tar.xz" \
            "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/linux-${KERNEL_VERSION}.tar.xz"
          echo "${KERNEL_SHA256}  $work/linux.tar.xz" | sha256sum -c -
          tar -xf "$work/linux.tar.xz" -C "$work"
          bash scripts/build-guest-kernel.sh --check "$work/linux-${KERNEL_VERSION}"

  build:
    name: Build and sign the guest kernel
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libelf-dev libssl-dev dwarves >/dev/null
      - name: Build vmlinux
        run: bash scripts/build-guest-kernel.sh out
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign vmlinux
        run: cosign sign-blob --yes --bundle out/vmlinux.sigstore.json out/vmlinux
      - name: Upload the workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: guest-kernel
          path: out/
          retention-days: 30
      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . kernel/kernel.env
          for f in vmlinux vmlinux.config SHA256SUMS vmlinux.sigstore.json; do
            cp "out/$f" "out/guest-kernel-${KERNEL_VERSION}-$f"
            gh release upload "$TAG" "out/guest-kernel-${KERNEL_VERSION}-$f" --clobber
          done
