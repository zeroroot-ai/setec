# End-to-end: the Go e2e suites in test/e2e, run against real
# Kata + Firecracker microVMs on a kind cluster inside a GitHub-hosted runner.
#
# WHERE THE MICROVMS RUN
#
# A GitHub-hosted ubuntu-latest runner exposes /dev/kvm (nested
# virtualization, measured 2026-09-27: 4 vCPU, 15 GB, kvm_amd loaded,
# KVM_GET_API_VERSION 12). The `suites` job creates a kind cluster on that
# runner. kind nodes are privileged containers, so the worker node sees
# /dev/kvm, and setec's own installer DaemonSet converges it to boot kata-fc:
# the kata payload, the devmapper thin-pool and the containerd registration
# (ADR-0003). No metal node, no ARC scale-set, no AWS account.
#
# This replaces the `runs-on: staging-ephemeral` design, which ran on an ARC
# scale-set inside staging EKS and pre-warmed an m5zn.metal from a Karpenter
# NodePool. Staging EKS was torn down on 2026-08-16. From then on every run
# sat `queued` with no runner to take it (setec#22).
#
# WHAT IS NOT HERE ANY MORE
#
#   - `roundtrip` and `teardown`. They shadow-installed the chart into staging
#     and booted one kata-qemu Sandbox from a shell script. The `suites` job
#     boots, runs and reads back Sandboxes from this build's chart and images
#     (TestSandbox_*), on an isolated cluster, with the webhook on.
#   - the `merge_group` trigger. The suites take tens of minutes, so they do
#     not gate a merge. They run nightly and on demand, and feed the tracking
#     issue below (ADR-0012: exit tests run on main and on a schedule).
#
# Triggers: the nightly schedule and manual `workflow_dispatch`.

name: e2e

on:
  workflow_dispatch: {}
  push:  # TEMPORARY: iteration trigger, removed before the PR
    branches: [fix/e2e-suites-kvm-runner]
  # Nightly. The suites are too long for the merge gate, but "not on every
  # merge" must not mean "never" (setec#298).
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------
  # build-images — GitHub-hosted (ADR-0060: no metal needed to build a Go
  # binary + container image, only to run it). Publishes sha-tagged images
  # that the `suites` job installs (its `needs:` + image-tag inputs below),
  # so the suites exercise this commit's exact build.
  # ----------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # pushes sha-tagged images to ghcr
    outputs:
      manager_image: ${{ steps.tags.outputs.manager_image }}
      runtime_agent_image: ${{ steps.tags.outputs.runtime_agent_image }}
      node_agent_image: ${{ steps.tags.outputs.node_agent_image }}
      installer_image: ${{ steps.tags.outputs.installer_image }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tags
        id: tags
        run: |
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "manager_image=ghcr.io/zeroroot-ai/setec:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "runtime_agent_image=ghcr.io/zeroroot-ai/setec-runtime-agent:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "node_agent_image=ghcr.io/zeroroot-ai/setec-node-agent:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "installer_image=ghcr.io/zeroroot-ai/setec-installer:${sha_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build + push manager (CMD=manager)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=manager
          push: true
          tags: ${{ steps.tags.outputs.manager_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push runtime-agent (CMD=runtime-agent)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=runtime-agent
          push: true
          tags: ${{ steps.tags.outputs.runtime_agent_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The node-agent is the ONLY component that talks to the session
      # checkpoint store (setec#194) — the operator forwards the per-session
      # KEK but never touches S3 — so the session-checkpoint job below needs
      # a PR build of it, and nothing else in this workflow would notice if
      # it stopped compiling.
      - name: Build + push node-agent (CMD=node-agent)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=node-agent
          push: true
          tags: ${{ steps.tags.outputs.node_agent_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The installer prepares the `suites` job's kind worker to boot kata-fc
      # (ADR-0003). On a kata-deploy node it is also what makes a kata-fc
      # microVM boot at all (setec#9): kata-deploy points the fc handler
      # at the devmapper snapshotter and configures neither a thin-pool nor
      # the snapshotter, so without the installer every kata-fc Sandbox
      # dies in containerd with "snapshotter must be provided to unpack".
      # Built from Dockerfile.installer with the kata pin from kata.env, as
      # images.yml does.
      - name: Read the kata pin
        id: kata
        run: |
          set -euo pipefail
          . ./kata.env
          echo "version=${KATA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${KATA_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Build + push installer (Dockerfile.installer)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.installer
          platforms: linux/amd64
          build-args: |
            KATA_VERSION=${{ steps.kata.outputs.version }}
            KATA_SHA256=${{ steps.kata.outputs.sha256 }}
          push: true
          tags: ${{ steps.tags.outputs.installer_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------
  session-checkpoint:
    if: vars.STAGING_SESSION_S3_READY == 'true'
    needs: build-images
    runs-on: staging-ephemeral
    timeout-minutes: 45
    # One at a time: the namespace is fixed (see above) and the scenarios
    # occupy a metal node for minutes at a stretch. Never cancel a run in
    # progress — a cancelled run skips its cleanup and strands a microVM.
    concurrency:
      group: setec-session-checkpoint-e2e
      cancel-in-progress: false
    env:
      # Must match the `extra_subjects` entry on the setec_node_agent IRSA
      # role in deploy eks/gibson/modules/iam-irsa/main.tf. The node-agent
      # ServiceAccount the chart renders is <release>-node-agent, so the
      # release name IS half of the IAM subject — renaming either side here
      # silently breaks S3 auth with an AssumeRoleWithWebIdentity denial.
      E2E_NAMESPACE: setec-e2e-session
      E2E_RELEASE: setec-e2e-session
      # The Sandbox-only namespace the suite installs beside the release
      # (setec#10). Every scenario's Sandbox, Pod and PVC lives here, the
      # operator and its agents stay in E2E_NAMESPACE.
      E2E_SANDBOX_NAMESPACE: setec-e2e-session-sandboxes
      # Separate from E2E_NAMESPACE on purpose: the suite's TestMain CREATES
      # E2E_NAMESPACE and fails if it already exists, so the pre-warm
      # placeholder cannot live there.
      WARM_NAMESPACE: setec-e2e-session-warm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # Every input this job needs that is NOT in the repo. Checked before
      # anything is installed so a misconfigured variable costs a few
      # seconds instead of a metal node and 40 minutes.
      - name: Verify the session-checkpoint infrastructure inputs are set
        run: |
          set -uo pipefail
          missing=0
          for v in STAGING_SESSION_S3_BUCKET STAGING_SESSION_S3_ROLE_ARN; do
            if [ -z "${!v:-}" ]; then
              echo "::error::repository variable ${v} is empty but STAGING_SESSION_S3_READY is true"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::apply the bootstrap/eks/gibson Terraform stack (module.s3 setec_checkpoints + module.iam_irsa setec_node_agent), then set the variables from its outputs: s3_bucket_names[\"setec_checkpoints\"] and iam_role_arns[\"setec_node_agent\"]"
            exit 1
          fi
        env:
          STAGING_SESSION_S3_BUCKET: ${{ vars.STAGING_SESSION_S3_BUCKET }}
          STAGING_SESSION_S3_ROLE_ARN: ${{ vars.STAGING_SESSION_S3_ROLE_ARN }}

      # setec#281 coordination. The runtime-agent labels each node with the
      # backends it can actually run; when that probe is wrong (as it was in
      # v0.110.1, which did not follow containerd's `imports` array) every
      # node reads NOT kata-capable and nothing schedules. That failure looks
      # exactly like a broken checkpoint path from inside the suite — a
      # Sandbox that never leaves Pending — so it is diagnosed HERE, once,
      # with the right issue number attached, instead of being misfiled
      # against the session code.
      - name: Preflight — kata-fc is installed on this cluster
        run: |
          set -uo pipefail
          if ! kubectl get runtimeclass kata-fc >/dev/null 2>&1; then
            echo "::error::RuntimeClass kata-fc is absent; kata-deploy has not run on this cluster (deploy#1080)"
            exit 1
          fi

      # The namespace is fixed, so a previous run that died between install
      # and cleanup leaves a release in the way. Reap it rather than failing
      # the install with "cannot re-use a name that is still in use". Runs
      # BEFORE the pre-warm so the warm pod lands beside a clean namespace.
      - name: Reap a previous run's leftovers
        run: |
          set -uo pipefail
          helm uninstall "${E2E_RELEASE}" -n "${E2E_NAMESPACE}" --wait --timeout 2m 2>/dev/null || true
          kubectl delete namespace "${E2E_SANDBOX_NAMESPACE}" --ignore-not-found --wait=true --timeout=3m || true
          kubectl delete namespace "${E2E_NAMESPACE}" --ignore-not-found --wait=true --timeout=3m || true
          kubectl delete namespace "${WARM_NAMESPACE}" --ignore-not-found --wait=true --timeout=3m || true
          for kind in clusterrole clusterrolebinding; do
            for obj in "${E2E_RELEASE}-manager" "${E2E_RELEASE}-runtime-agent" "${E2E_RELEASE}-node-agent"; do
              kubectl delete "$kind" "$obj" --ignore-not-found --wait=false || true
            done
          done
          # Both are CLUSTER-scoped and created by test bodies under t.Cleanup,
          # which does not run when a job is cancelled (setec#255) — so a leak
          # here outlives the namespace and is visible cluster-wide.
          for cls in "e2e-session-checkpoint-${E2E_NAMESPACE}" "e2e-session-${E2E_NAMESPACE}"; do
            kubectl delete sandboxclass "$cls" --ignore-not-found --wait=false || true
          done

      # WITHOUT THIS STEP THIS JOB CAN NEVER BE GREEN (setec#296).
      #
      # The kata-fc capability assertion used to sit in the preflight above
      # and exit 1 within seconds when no node carried the label. But the
      # setec-metal Karpenter NodePool is scale-to-zero by design and nothing
      # in this job provokes it, so on a quiet cluster — the normal state —
      # the assertion was guaranteed to fail. Verified 2026-08-15:
      # `kubectl get nodepool setec-metal` reports 0 nodes. The four
      # repository variables and the Terraform apply this job waits on would
      # have been spent to reach a failure in the first 30 seconds, reading
      # as a session-path defect.
      #
      # Modelled on the identical step in `suites` (setec#316): schedule a
      # placeholder requiring ONLY `setec.zeroroot.ai/sandbox-host`, the label
      # the NodePool template declares and therefore the only one Karpenter
      # will provision for — a Sandbox Pod's own required `runtime.<backend>`
      # affinity names a key the NodePool does not declare and Karpenter
      # rejects it outright.
      #
      # The placeholder STAYS UP for the whole job: the NodePool's
      # `consolidateAfter: 120s` would otherwise reap the metal node two
      # minutes after the last sandbox exits, mid-run. `sleep 3000` outstrips
      # this job's `timeout-minutes: 45`.
      #
      # It lives in its own namespace, NOT ${E2E_NAMESPACE}: the suite's
      # TestMain CREATES that namespace and fails if it already exists.
      - name: Pre-warm a kata-fc-capable metal node (scale-from-zero)
        run: |
          set -euo pipefail
          kubectl create namespace "${WARM_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete pod setec-e2e-session-warm -n "${WARM_NAMESPACE}" --ignore-not-found --wait=true --timeout=2m
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: setec-e2e-session-warm
            namespace: ${WARM_NAMESPACE}
          spec:
            nodeSelector:
              setec.zeroroot.ai/sandbox-host: "true"
            tolerations:
              - key: setec.zeroroot.ai/sandbox-host
                operator: Equal
                value: "true"
                effect: NoSchedule
            containers:
              - name: warm
                image: ghcr.io/zeroroot-ai/mirror/kubectl:1.31.4
                command: ["sleep", "3000"]
                resources:
                  requests:
                    cpu: 50m
                    memory: 32Mi
            restartPolicy: Never
          EOF

          echo "waiting for a kata-fc-capable node (metal boot + kata-deploy, up to ~18 min)..."
          for i in $(seq 1 72); do
            # BOTH labels, for the reason roundtrip documents (setec#243): the
            # runtime-agent's capability label can fire before kata is really
            # installed, and `katacontainers.io/kata-runtime=true` is written
            # by kata-deploy only once containerd is configured.
            #
            # Memory checkpointing is a Firecracker snapshot operation, so
            # kata-qemu cannot serve these scenarios however healthy it looks;
            # kata-fc is the label that counts here.
            n="$(kubectl get nodes \
              -l setec.zeroroot.ai/runtime.kata-fc=true,katacontainers.io/kata-runtime=true \
              -o name 2>/dev/null | head -1)"
            if [ -n "$n" ]; then
              echo "kata-fc-capable node ready after ${i} polls: ${n}"
              exit 0
            fi
            sleep 15
          done

          echo "--- node runtime labels ---"
          kubectl get nodes -L setec.zeroroot.ai/runtime.kata-fc,setec.zeroroot.ai/runtime.kata-qemu,katacontainers.io/kata-runtime -o wide || true
          kubectl -n "${WARM_NAMESPACE}" describe pod setec-e2e-session-warm || true
          kubectl get nodeclaims -o wide 2>/dev/null || true
          echo "::error::no node gained setec.zeroroot.ai/runtime.kata-fc=true within the wait window. If a sandbox-host node IS up and kata-deploy has installed the shims, this is the runtime-agent probe bug zeroroot-ai/setec#281 (the probe ignores containerd's \`imports\` array) — NOT a session-checkpoint defect. Confirm setec >= v0.110.2 is the running runtime-agent before filing anything against the session path."
          exit 1

      - name: Run the session lifecycle scenarios
        env:
          # This job runs on an in-cluster ARC runner and the suite is
          # destructive (helm install + namespace create before test one), so
          # it states its intent explicitly. Without this the suite refuses to
          # touch the cluster (setec#298).
          SETEC_E2E_ALLOW_ANY_CLUSTER: "1"
          # The setec-metal NodePool taints its nodes
          # setec.zeroroot.ai/sandbox-host=true:NoSchedule, and those are the
          # only nodes the runtime-agent ever labels runtime.<backend>=true —
          # the nodeSelector every RuntimeClass puts on a Sandbox Pod. Without
          # this the two contradict and every Sandbox sits Pending forever
          # (setec#330). The suite injects it into every SandboxClass it
          # creates; it cannot use the chart's
          # runtimeClasses.*.scheduling.tolerations because it installs with
          # runtimes.kata-fc.install=false — kata-deploy owns the RuntimeClass
          # here, so the chart renders none.
          SETEC_E2E_SANDBOX_HOST_TAINT: setec.zeroroot.ai/sandbox-host=true:NoSchedule
          # Suite identity — see the E2E_NAMESPACE comment above.
          SETEC_E2E_NAMESPACE: ${{ env.E2E_NAMESPACE }}
          SETEC_E2E_SANDBOX_NAMESPACE: ${{ env.E2E_SANDBOX_NAMESPACE }}
          SETEC_E2E_RELEASE: ${{ env.E2E_RELEASE }}
          SETEC_E2E_RUNTIMECLASS: kata-fc
          # PR-built images, pulled from ghcr. pullPolicy=Never (the suite
          # default, right for a runner that side-loads into a node's image
          # store) is WRONG here: this runner is an ordinary pod and cannot
          # reach any node's store.
          SETEC_E2E_IMAGE_TAG: ${{ needs.build-images.outputs.sha_tag }}
          SETEC_E2E_IMAGE_PULL_POLICY: IfNotPresent
          SETEC_E2E_IMAGE_REPO: ghcr.io/zeroroot-ai/setec
          SETEC_E2E_RUNTIME_AGENT_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-runtime-agent
          SETEC_E2E_NODE_AGENT_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-node-agent
          # The installer supplies the devmapper thin-pool and snapshotter
          # the kata-deploy fc handler asks for (setec#9). Without it no
          # kata-fc Sandbox boots on the metal node.
          SETEC_E2E_INSTALLER: "1"
          SETEC_E2E_INSTALLER_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-installer
          # The chart's ValidatingWebhookConfiguration is CLUSTER-scoped with
          # failurePolicy=Fail. On this SHARED cluster a run that dies before
          # cleanup would fail every Sandbox write cluster-wide until a human
          # deleted it. The session scenarios do not exercise admission.
          SETEC_E2E_WEBHOOK: "0"
          # Session-checkpoint store. The prefix must match the one the IAM
          # policy is scoped to (local.setec_checkpoint_prefix in deploy
          # eks/gibson/modules/iam-irsa/main.tf); a mismatch reads as
          # AccessDenied at the first suspend.
          SETEC_E2E_S3: "1"
          SETEC_E2E_S3_BUCKET: ${{ vars.STAGING_SESSION_S3_BUCKET }}
          SETEC_E2E_S3_REGION: ${{ vars.STAGING_SESSION_S3_REGION || 'us-east-1' }}
          SETEC_E2E_S3_PREFIX: sessions/
          SETEC_E2E_S3_ROLE_ARN: ${{ vars.STAGING_SESSION_S3_ROLE_ARN }}
          # The drain scenario needs a SECOND m5zn.metal (~$4/hr on-demand)
          # and the setec-metal NodePool is capped at one by design. It skips
          # LOUDLY unless an operator raises the ceiling for a run and sets
          # this variable; see docs/session-checkpoints.md.
          SETEC_E2E_SESSION_DRAIN: ${{ vars.STAGING_SESSION_DRAIN_CAPACITY }}
        run: |
          # TestSession_ReattachByHandle is NOT here any more: it needs no
          # bucket, no IRSA role and no node-agent, so gating it on
          # STAGING_SESSION_S3_READY meant it ran nowhere at all. It moved to
          # `suites`, which needs only an ARC runner (setec#296).
          go test -tags=e2e ./test/e2e/... -v -timeout 40m \
            -run '^TestSessionCheckpoint_.*$' \
            2>&1 | tee session-e2e.log
          status="${PIPESTATUS[0]}"
          # A skipped scenario is not a verified scenario. Surface every one
          # in the job summary so a green check never gets read as coverage
          # it does not have.
          {
            echo "### session-checkpoint scenarios"
            echo ''
            grep -E '^(=== RUN|--- (PASS|FAIL|SKIP))' session-e2e.log || true
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q -- '--- SKIP' session-e2e.log; then
            echo "::warning::one or more session scenarios SKIPPED — see the job summary; this run did not verify them"
          fi
          exit "$status"

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          mkdir -p session-e2e-artifacts
          kubectl get nodes -o wide -L setec.zeroroot.ai/runtime.kata-fc > session-e2e-artifacts/nodes.txt 2>&1 || true
          kubectl get sandboxes -n "${E2E_SANDBOX_NAMESPACE}" -o yaml > session-e2e-artifacts/sandboxes.yaml 2>&1 || true
          kubectl get pods,pvc -n "${E2E_SANDBOX_NAMESPACE}" -o wide > session-e2e-artifacts/sandbox-pods.txt 2>&1 || true
          kubectl get events -n "${E2E_SANDBOX_NAMESPACE}" --sort-by=.lastTimestamp > session-e2e-artifacts/sandbox-events.txt 2>&1 || true
          kubectl get pods -n "${E2E_NAMESPACE}" -o wide > session-e2e-artifacts/pods.txt 2>&1 || true
          kubectl get events -n "${E2E_NAMESPACE}" --sort-by=.lastTimestamp > session-e2e-artifacts/events.txt 2>&1 || true
          kubectl logs -n "${E2E_NAMESPACE}" -l app.kubernetes.io/name=setec --tail=500 --all-containers \
            > session-e2e-artifacts/operator.log 2>&1 || true
          # The node-agent log is where an S3/KMS AccessDenied actually
          # appears; the operator only ever sees "checkpoint failed".
          kubectl logs -n "${E2E_NAMESPACE}" -l app.kubernetes.io/component=node-agent --tail=500 \
            > session-e2e-artifacts/node-agent.log 2>&1 || true
          cp session-e2e.log session-e2e-artifacts/ 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: session-checkpoint-diagnostics
          path: session-e2e-artifacts/
          retention-days: 7

      # The suite's own TestMain uninstalls on the way out, but only if it
      # reached that point — a timeout or a cancelled job never gets there,
      # and this namespace is fixed, so the leftovers block the NEXT run
      # rather than expiring with the run id.
      # `if: always()` does NOT run on a cancelled job (setec#255), so it
      # cannot be the only thing standing between a cancel and a stranded
      # ~$4/hr metal node. Two other mechanisms carry that load: the warm
      # pod's own `sleep 3000` expires 50 minutes in whatever happens to this
      # job, after which Karpenter consolidates the node 120s later; and the
      # "Reap a previous run's leftovers" step above deletes WARM_NAMESPACE
      # before the next run installs anything.
      - name: Clean up
        if: always()
        run: |
          set -uo pipefail
          helm uninstall "${E2E_RELEASE}" -n "${E2E_NAMESPACE}" --wait=false 2>/dev/null || true
          for ns in "${E2E_SANDBOX_NAMESPACE}" "${E2E_NAMESPACE}"; do
            kubectl delete namespace "$ns" --ignore-not-found --wait=false \
              || echo "::warning::could not delete ${ns}; the next run reaps it"
          done
          # The placeholder pins the metal node for as long as it exists, so
          # reaping it is a cost control rather than tidiness.
          kubectl delete namespace "${WARM_NAMESPACE}" --ignore-not-found --wait=false || true
          # Both are CLUSTER-scoped and created by test bodies under t.Cleanup,
          # which does not run when a job is cancelled (setec#255) — so a leak
          # here outlives the namespace and is visible cluster-wide.
          for cls in "e2e-session-checkpoint-${E2E_NAMESPACE}" "e2e-session-${E2E_NAMESPACE}"; do
            kubectl delete sandboxclass "$cls" --ignore-not-found --wait=false || true
          done
          for kind in clusterrole clusterrolebinding; do
            for obj in "${E2E_RELEASE}-manager" "${E2E_RELEASE}-runtime-agent" "${E2E_RELEASE}-node-agent"; do
              kubectl delete "$kind" "$obj" --ignore-not-found --wait=false || true
            done
          done

  # ----------------------------------------------------------------------
  # suites: the Go e2e scenarios (setec#298), on kind + nested KVM (setec#22).
  #
  # One runner, one kind cluster, three `go test` passes. Each pass installs
  # its own throwaway release from THIS checkout's chart with the images
  # build-images pushed, and uninstalls it on the way out (TestMain):
  #
  #   1. The guard. TestEnv_KVMPresent and TestInstaller_Converges run alone,
  #      before anything else, so an incapable environment fails the job
  #      here instead of turning the rest into a green all-skip. In one
  #      `go test` they would not run first: Go orders tests by file name.
  #   2. The suites with snapshots off. This pass also holds the scenarios
  #      a shared cluster could not run: the admission webhook, and the
  #      RuntimeClass delete in TestSandbox_ZZ_NoRuntimeClass.
  #   3. Phase 3 with snapshots on: snapshot/restore, the pool, and both
  #      ADR-0005 invariants. Snapshots are an install-time switch, and
  #      TestPhase3_UpgradeFromPhase2 needs them off, so this is its own
  #      install.
  #
  # A SKIP fails the pass. A skipped scenario is not a verified one, and the
  # warning the old job printed was read as a pass. The one exclusion is
  # named in the `-skip` flag below, with the reason beside it.
  # ----------------------------------------------------------------------
  suites:
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KIND_CLUSTER: setec-kvm
      # The worker is the one node that hosts microVMs (hack/kind-kvm.yaml).
      KVM_NODE: setec-kvm-worker
      # A throwaway cluster that exists only for this job. Naming a context
      # would add nothing, so consent is explicit instead (setec#298).
      SETEC_E2E_ALLOW_ANY_CLUSTER: "1"
      SETEC_E2E_RUNTIMECLASS: kata-fc
      # This build's images, pulled from ghcr (the packages are public).
      SETEC_E2E_IMAGE_TAG: ${{ needs.build-images.outputs.sha_tag }}
      SETEC_E2E_IMAGE_PULL_POLICY: IfNotPresent
      SETEC_E2E_IMAGE_REPO: ghcr.io/zeroroot-ai/setec
      SETEC_E2E_RUNTIME_AGENT_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-runtime-agent
      SETEC_E2E_NODE_AGENT_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-node-agent
      # setec's own installer prepares the node: kata payload, devmapper
      # thin-pool, containerd registration (ADR-0003). There is no kata-deploy
      # on this cluster, so the installer runs in full mode.
      SETEC_E2E_INSTALLER: "1"
      SETEC_E2E_INSTALLER_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-installer
      # The cluster is isolated, so the webhook stays on. A dead run cannot
      # fail anyone else's Sandbox writes closed.
      SETEC_E2E_WEBHOOK: "1"
      # Chart overrides for this cluster, appended to every pass's install:
      #   - pin the installer to the worker, so it never restarts containerd
      #     under the API server on the control-plane node;
      #   - a 20 GiB sparse thin-pool instead of 50. The runner disk is small,
      #     and the scenarios write far less than that;
      #   - a 30s runtime-agent probe interval instead of 5m. The agent's
      #     first probe can land before the installer registers kata-fc, and
      #     the label then waits one interval. TestEnv_KVMPresent waits 3m.
      NODE_SET: >-
        installer.nodeSelector.setec\.zeroroot\.ai/e2e-role=sandbox-host,installer.thinpool.loopDataSizeGB=20,defaults.runtime.probeInterval=30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Make /dev/kvm usable
        # The runner's /dev/kvm is root:kvm 0660. kind copies the host device
        # nodes into each node container with the mode they have when the
        # container starts, so the mode has to change BEFORE the cluster
        # exists. The ioctl proves the device answers, not only that it is
        # present.
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          grep -E '^kvm_(intel|amd) ' /proc/modules
          sudo chmod 666 /dev/kvm
          python3 - <<'PY'
          import fcntl, os
          fd = os.open("/dev/kvm", os.O_RDWR)
          version = fcntl.ioctl(fd, 0xAE00)  # KVM_GET_API_VERSION
          print("KVM API version:", version)
          assert version == 12, "unexpected KVM API version"
          PY

      - name: Create the kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: hack/kind-kvm.yaml
          wait: 120s

      - name: Prepare the worker node
        # Five facts about a kind node that a real node does not share:
        #
        #   - /dev/kvm must be visible inside the node container. The check
        #     here fails the job with a clear message if it is not.
        #   - The kind image builds containerd without the devmapper
        #     snapshotter, and kata-fc needs it: Firecracker takes a block
        #     device per container rootfs. So the worker gets the upstream
        #     containerd release of the same version, checked against its
        #     published SHA-256. Upstream builds include devmapper. The
        #     installer then refuses to report converged on a containerd
        #     that did not load it.
        #   - No udev runs inside the node container, so nothing creates the
        #     /dev/mapper node when dmsetup activates a device. containerd
        #     then reports the thin-pool as "Device does not exist", and a
        #     failed devmapper plugin takes containerd's metadata store down
        #     with it. DM_DISABLE_UDEV=1 makes libdevmapper create the nodes
        #     itself, for containerd and for the installer's thin-pool unit.
        #   - The kind image ships /etc/containerd as 0644, with no execute
        #     bit. The runtime-agent runs as non-root and cannot traverse
        #     into the directory to read the containerd config, so it would
        #     never label the node kata-fc capable. Real nodes ship 0755.
        #   - gVisor is bring-your-own. The installer lays down kata only,
        #     and TestRuntimeBackends_* boot a gvisor Sandbox beside the
        #     kata-fc one, and fall back to gvisor when kata-fc is gone.
        #     This installs runsc from the gVisor release bucket, checks its
        #     SHA-512, and registers the handler with containerd.
        run: |
          set -euo pipefail
          docker exec "${KVM_NODE}" test -c /dev/kvm || {
            echo "::error::/dev/kvm is not a character device inside ${KVM_NODE}"
            exit 1
          }
          docker exec "${KVM_NODE}" ls -l /dev/kvm
          docker exec "${KVM_NODE}" chmod 0755 /etc/containerd
          for unit in containerd.service setec-thinpool.service; do
            docker exec "${KVM_NODE}" sh -c "mkdir -p /etc/systemd/system/${unit}.d && printf '[Service]\nEnvironment=DM_DISABLE_UDEV=1\n' > /etc/systemd/system/${unit}.d/05-dm-disable-udev.conf"
          done
          docker exec "${KVM_NODE}" systemctl daemon-reload

          version="$(docker exec "${KVM_NODE}" containerd --version | awk '{print $3}')"
          version="${version#v}"
          echo "kind node containerd: ${version}"
          cdir="$(mktemp -d)"
          tarball="containerd-${version}-linux-amd64.tar.gz"
          curl -fsSL -o "${cdir}/${tarball}" \
            "https://github.com/containerd/containerd/releases/download/v${version}/${tarball}"
          curl -fsSL -o "${cdir}/${tarball}.sha256sum" \
            "https://github.com/containerd/containerd/releases/download/v${version}/${tarball}.sha256sum"
          (cd "${cdir}" && sha256sum -c "${tarball}.sha256sum")
          tar -xzf "${cdir}/${tarball}" -C "${cdir}" bin/containerd
          docker cp "${cdir}/bin/containerd" "${KVM_NODE}:/usr/local/bin/containerd"

          # gVisor ships one tarball per release: runsc, the containerd shim,
          # and a gvisor-bin/ directory runsc reads beside itself. The loose
          # runsc download the gVisor docs still name returns 404.
          url=https://storage.googleapis.com/gvisor/releases/release/latest/x86_64
          dir="$(mktemp -d)"
          curl -fsSL -o "${dir}/gvisor.tar.bz2" "${url}/gvisor.tar.bz2"
          curl -fsSL -o "${dir}/gvisor.tar.bz2.sha512" "${url}/gvisor.tar.bz2.sha512"
          (cd "${dir}" && sha512sum -c gvisor.tar.bz2.sha512)
          mkdir "${dir}/bin"
          tar -xjf "${dir}/gvisor.tar.bz2" -C "${dir}/bin"
          docker cp "${dir}/bin/." "${KVM_NODE}:/usr/local/bin/"
          docker exec "${KVM_NODE}" /usr/local/bin/runsc --version
          docker exec "${KVM_NODE}" sh -c 'cat >> /etc/containerd/config.toml <<EOF

          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
            runtime_type = "io.containerd.runsc.v1"
          EOF'
          docker exec "${KVM_NODE}" systemctl restart containerd
          kubectl wait --for=condition=Ready "node/${KVM_NODE}" --timeout=120s
          docker exec "${KVM_NODE}" crictl info | grep -q '"runsc"' || {
            echo "::error::containerd on ${KVM_NODE} did not register the runsc handler"
            exit 1
          }
          # The plugin reports "skip" until the installer configures a pool.
          # Present is what this step can prove.
          docker exec "${KVM_NODE}" ctr plugins ls | grep -E 'io\.containerd\.snapshotter\.v1 +devmapper ' || {
            echo "::error::containerd on ${KVM_NODE} has no devmapper snapshotter plugin"
            exit 1
          }

      - name: Create the chart's RuntimeClasses
        # The suite requires the RuntimeClass to exist before it installs,
        # and installs with runtimes.<backend>.install=false. So the objects
        # come from the chart's own template, rendered here with install=true,
        # and are identical to what a default install renders. The values
        # besides the runtimes only satisfy the chart's render guards.
        run: |
          set -euo pipefail
          helm template rc ./charts/setec \
            --show-only templates/runtime-classes.yaml \
            --set webhook.enabled=false \
            --set 'sandboxNamespaces={render-only}' \
            --set runtimes.kata-fc.install=true \
            --set runtimes.gvisor.enabled=true \
            --set runtimes.gvisor.install=true \
            | kubectl apply -f -
          kubectl get runtimeclass

      - name: "Pass 1: the KVM guard"
        id: guard
        env:
          SETEC_E2E_NAMESPACE: setec-e2e-guard
          SETEC_E2E_SANDBOX_NAMESPACE: setec-e2e-guard-sandboxes
          SETEC_E2E_RELEASE: setec-e2e-guard
        run: |
          set +e
          set -uo pipefail
          SETEC_E2E_EXTRA_SET="${NODE_SET}" \
            go test -tags=e2e ./test/e2e/... -v -timeout 20m \
            -run '^(TestEnv_KVMPresent|TestInstaller_Converges)$' \
            2>&1 | tee guard.log
          status="${PIPESTATUS[0]}"
          scripts/e2e-summary.sh "Pass 1: the KVM guard" guard.log "$status"

      - name: "Pass 2: the suites, snapshots off"
        env:
          SETEC_E2E_NAMESPACE: setec-e2e-suites
          SETEC_E2E_SANDBOX_NAMESPACE: setec-e2e-suites-sandboxes
          SETEC_E2E_RELEASE: setec-e2e-suites
        run: |
          set +e
          set -uo pipefail
          # -skip: the installer registers kata-fc only, so no node can run
          # kata-qemu here. That subtest would SKIP on its own, and a SKIP
          # fails this pass. kata-qemu coverage is tracked in its own issue.
          SETEC_E2E_EXTRA_SET="${NODE_SET}" \
            go test -tags=e2e ./test/e2e/... -v -timeout 60m \
            -run '^(TestSandbox_.*|TestSandboxClasses_.*|TestNodeAgentMTLS_.*|TestPhase2_.*|TestPhase3_UpgradeFromPhase2|TestEgress_.*|TestRuntimeBackends_.*|TestSession_(WorkspaceSurvivesPodKill|ReattachByHandle)|TestSessionExec_.*)$' \
            -skip '^TestRuntimeBackends_Smoke/backend=kata-qemu$' \
            2>&1 | tee suites.log
          status="${PIPESTATUS[0]}"
          scripts/e2e-summary.sh "Pass 2: the suites, snapshots off" suites.log "$status"

      - name: "Pass 3: Phase 3, snapshots on"
        # Runs after a pass 2 failure too, so one run reports both passes.
        # It runs only when the guard passed: with no capable node every
        # scenario here fails for the same reason the guard already named.
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        env:
          SETEC_E2E_NAMESPACE: setec-e2e-phase3
          SETEC_E2E_SANDBOX_NAMESPACE: setec-e2e-phase3-sandboxes
          SETEC_E2E_RELEASE: setec-e2e-phase3
          SETEC_E2E_SNAPSHOTS: "1"
        run: |
          set +e
          set -uo pipefail
          # The node-agent takes the Firecracker snapshots. The chart pins it
          # to kata-deploy's node label, which this cluster does not carry,
          # so the selector moves to the worker.
          node_agent_set="nodeAgent.enabled=true,nodeAgent.image.repository=${SETEC_E2E_NODE_AGENT_IMAGE_REPO},nodeAgent.image.tag=${SETEC_E2E_IMAGE_TAG},nodeAgent.nodeSelector.katacontainers\.io/kata-runtime=null,nodeAgent.nodeSelector.setec\.zeroroot\.ai/e2e-role=sandbox-host"
          # TestMain uninstalls the release on the way out, so a node-agent
          # that crashed mid-pass leaves no logs behind. Sample them while
          # the pass runs.
          (
            while sleep 60; do
              echo "--- $(date -u +%H:%M:%S)"
              kubectl logs -n "${SETEC_E2E_NAMESPACE}" -l app.kubernetes.io/component=node-agent \
                --all-containers --previous --tail=60 2>&1
              kubectl logs -n "${SETEC_E2E_NAMESPACE}" -l app.kubernetes.io/component=node-agent \
                --all-containers --tail=60 2>&1
            done
          ) > node-agent.log &
          sampler=$!
          SETEC_E2E_EXTRA_SET="${NODE_SET},${node_agent_set}" \
            go test -tags=e2e ./test/e2e/... -v -timeout 45m \
            -run '^(TestPhase3_(SnapshotRoundtrip|PauseResume|SnapshotTTL|RestoredClonesDivergeInRNG|RestoredClonesHaveUniqueIdentity|PoolWarmStartLifecycle|StorageFillProtection)|TestGate_UnverifiedWarmStartFailsClosed)$' \
            2>&1 | tee phase3.log
          status="${PIPESTATUS[0]}"
          kill "$sampler" 2>/dev/null
          scripts/e2e-summary.sh "Pass 3: Phase 3, snapshots on" phase3.log "$status"

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          kubectl get nodes -o wide --show-labels || true
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.metadata.annotations.setec\.zeroroot\.ai/runtime-probe}{"\n"}{end}' || true
          kubectl get runtimeclass,sandboxclasses -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          echo "::group::containerd on ${KVM_NODE}"
          docker exec "${KVM_NODE}" journalctl -u containerd --no-pager | tail -200 || true
          echo "::endgroup::"
          echo "::group::thin-pool on ${KVM_NODE}"
          docker exec "${KVM_NODE}" journalctl -u setec-thinpool --no-pager | tail -50 || true
          docker exec "${KVM_NODE}" dmsetup ls || true
          docker exec "${KVM_NODE}" ls -l /dev/mapper || true
          docker exec "${KVM_NODE}" ctr plugins ls || true
          docker exec "${KVM_NODE}" journalctl -u containerd --no-pager | grep -iE 'devmapper|failed to load plugin' | tail -40 || true
          docker exec "${KVM_NODE}" losetup -a || true
          echo "::endgroup::"

      - name: Upload the test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-suites-logs
          path: |
            guard.log
            suites.log
            phase3.log
            node-agent.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # notify-suites — make a red nightly loud.
  #
  # `suites` runs on a schedule, and a scheduled workflow that fails is the
  # quietest thing in GitHub: no PR turns red, no merge is blocked, and the
  # only trace is a row in a list nobody opens. That is the same failure mode
  # as the suite having no runner at all (setec#298), one step removed, so
  # the run files its own report.
  #
  # Deduplicated by a marker in the title: a suite that stays broken for a
  # week updates one issue rather than opening seven.
  # ----------------------------------------------------------------------
  notify-suites:
    needs: suites
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'e2e: the nightly `suites` run is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          # printf rather than a heredoc: a heredoc terminator must sit at
          # column 0, and a line at column 0 would end this YAML block scalar.
          # Leading whitespace also has to stay out of the body itself — an
          # indented line renders as a code block in a GitHub issue.
          body="$(printf '%s\n' \
            "The nightly \`e2e / suites\` run failed: ${RUN_URL}" \
            "" \
            "These are the Go e2e scenarios that had no runner before setec#298 — the" \
            "ADR-0005 invariants, egress confinement, the phase2/phase3 lifecycle, and" \
            "the \`TestEnv_KVMPresent\` guard. A red run here means one of those" \
            "invariants is unverified, not that CI is untidy." \
            "" \
            "Check the job summary for the PASS/FAIL/SKIP list before triaging: a SKIP" \
            "is also a failure of coverage, and the run warns on one.")"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${body}"
          fi
