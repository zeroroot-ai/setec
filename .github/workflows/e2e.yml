# End-to-end: the Go e2e suites in test/e2e, run against real
# Kata + Firecracker microVMs on a kind cluster inside a GitHub-hosted runner.
#
# WHERE THE MICROVMS RUN
#
# A GitHub-hosted ubuntu-latest runner exposes /dev/kvm (nested
# virtualization, measured 2026-09-27: 4 vCPU, 15 GB, kvm_amd loaded,
# KVM_GET_API_VERSION 12). The `suites` job creates a kind cluster on that
# runner. The worker node mounts the runner's /dev, so it sees /dev/kvm, and
# setec's own installer DaemonSet converges it to boot kata-fc: the kata
# payload, the devmapper thin-pool and the containerd registration
# (ADR-0143). The cluster runs Calico, so NetworkPolicy is enforced the way
# production CNIs enforce it. hack/kind-kvm.yaml has the details. No metal
# node, no ARC scale-set, no AWS account.
#
# This replaces the `runs-on: staging-ephemeral` design, which ran on an ARC
# scale-set inside staging EKS and pre-warmed an m5zn.metal from a Karpenter
# NodePool. Staging EKS was torn down on 2026-08-16. From then on every run
# sat `queued` with no runner to take it (setec#22).
#
# WHAT IS NOT HERE ANY MORE
#
#   - `roundtrip` and `teardown`. They shadow-installed the chart into staging
#     and booted one kata-qemu Sandbox from a shell script. The `suites` job
#     boots, runs and reads back Sandboxes from this build's chart and images
#     (TestSandbox_*), on an isolated cluster, with the webhook on. No job
#     boots kata-qemu now: the installer registers kata-fc only (setec#93).
#   - `session-checkpoint`. It needed a staging bucket and an IRSA role that
#     no longer exist, behind a variable that was never set. Its two
#     scenarios need an object store. The way back is an in-cluster MinIO on
#     this same kind cluster (setec#16).
#   - the `merge_group` trigger. The suites take tens of minutes, so they do
#     not gate a merge. They run nightly and on demand, and feed the tracking
#     issue below (ADR-0080: exit tests run on main and on a schedule).
#
# Triggers: the nightly schedule and manual `workflow_dispatch`.

name: e2e

on:
  workflow_dispatch: {}
  # Nightly. The suites are too long for the merge gate, but "not on every
  # merge" must not mean "never" (setec#298).
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------
  # build-images — GitHub-hosted (no metal needed to build a Go
  # binary + container image, only to run it). Publishes sha-tagged images
  # that the `suites` job installs (its `needs:` + image-tag inputs below),
  # so the suites exercise this commit's exact build.
  # ----------------------------------------------------------------------
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # pushes sha-tagged images to ghcr
    outputs:
      manager_image: ${{ steps.tags.outputs.manager_image }}
      runtime_agent_image: ${{ steps.tags.outputs.runtime_agent_image }}
      node_agent_image: ${{ steps.tags.outputs.node_agent_image }}
      installer_image: ${{ steps.tags.outputs.installer_image }}
      keepalive_image_repo: ${{ steps.tags.outputs.keepalive_image_repo }}
      sha_tag: ${{ steps.tags.outputs.sha_tag }}
      # The kata pin, so the out-of-band kata-qemu prep in `suites` fetches the
      # same release the installer image was built from. Two different kata
      # releases on one node is the shape where a handler loads and then fails
      # at launch (setec#93).
      kata_version: ${{ steps.pins.outputs.kata_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute image tags
        id: tags
        run: |
          sha_tag="sha-${GITHUB_SHA::12}"
          echo "sha_tag=${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "manager_image=ghcr.io/zeroroot-ai/setec:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "runtime_agent_image=ghcr.io/zeroroot-ai/setec-runtime-agent:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "node_agent_image=ghcr.io/zeroroot-ai/setec-node-agent:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "installer_image=ghcr.io/zeroroot-ai/setec-installer:${sha_tag}" >> "$GITHUB_OUTPUT"
          echo "keepalive_image_repo=ghcr.io/zeroroot-ai/setec-keepalive" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build + push manager (CMD=manager)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=manager
          push: true
          tags: ${{ steps.tags.outputs.manager_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build + push runtime-agent (CMD=runtime-agent)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=runtime-agent
          push: true
          tags: ${{ steps.tags.outputs.runtime_agent_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The node-agent takes the Firecracker snapshots, so the `phase3` half
      # of the suites job runs this build of it.
      - name: Build + push node-agent (CMD=node-agent)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=node-agent
          push: true
          tags: ${{ steps.tags.outputs.node_agent_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every kata-fc session Sandbox boots this image's binary, not only
      # a session with no spec.command (setec#91): the `suites` scenarios
      # (TestSession_*, TestSessionExec_*) are the only place any of this
      # binary's code has ever run in-cluster, so they need THIS build's
      # setec-keepalive, not the chart's own released default — the
      # "session scenarios" step below overrides sessionKeepalive.image
      # to point at it.
      - name: Build + push setec-keepalive (CMD=setec-keepalive)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: CMD=setec-keepalive
          push: true
          tags: ${{ steps.tags.outputs.keepalive_image_repo }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The installer prepares the `suites` job's kind worker to boot kata-fc
      # (ADR-0143). On a kata-deploy node it is also what makes a kata-fc
      # microVM boot at all (setec#9): kata-deploy points the fc handler
      # at the devmapper snapshotter and configures neither a thin-pool nor
      # the snapshotter, so without the installer every kata-fc Sandbox
      # dies in containerd with "snapshotter must be provided to unpack".
      # Built from Dockerfile.installer with every runtime pin, as images.yml
      # does. scripts/runtime-build-args.sh is the one list, so a new runtime
      # does not have to be remembered here.
      - name: Read the runtime pins
        id: pins
        run: |
          set -euo pipefail
          . ./kata.env
          test -n "${KATA_VERSION}" || { echo "::error::kata.env sets no KATA_VERSION"; exit 1; }
          {
            echo "build_args<<EOF_ARGS"
            scripts/runtime-build-args.sh
            echo "EOF_ARGS"
            echo "kata_version=${KATA_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push installer (Dockerfile.installer)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.installer
          platforms: linux/amd64
          build-args: ${{ steps.pins.outputs.build_args }}
          push: true
          tags: ${{ steps.tags.outputs.installer_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------
  # suites: the Go e2e scenarios (setec#298), on kind + nested KVM (setec#22).
  #
  # Two jobs from one matrix, each on its own runner and kind cluster, so the
  # two halves run side by side and one failing does not hide the other.
  # Every `go test` installs its own throwaway release from THIS checkout's
  # chart with the images build-images pushed, and uninstalls it on the way
  # out (TestMain).
  #
  # Each job runs two steps:
  #
  #   1. The guard. TestEnv_KVMPresent and TestInstaller_Converges run alone,
  #      before anything else, so an incapable environment fails the job
  #      here instead of turning the rest into a green all-skip. In one
  #      `go test` they would not run first: Go orders tests by file name.
  #   2. Its half of the scenarios:
  #        suites  snapshots off. It also holds the scenarios a shared
  #                cluster could not run: the admission webhook, and the
  #                RuntimeClass delete in TestSandbox_ZZ_NoRuntimeClass.
  #        phase3  snapshots on: snapshot/restore, the pool, and both
  #                ADR-0145 invariants. Snapshots are an install-time
  #                switch, and TestPhase3_UpgradeFromPhase2 needs them off.
  #
  # A SKIP fails the step. A skipped scenario is not a verified one, and the
  # warning the old job printed was read as a pass. The one exclusion is
  # named in the matrix `skip` entry, with the reason beside it.
  # ----------------------------------------------------------------------
  suites:
    name: suites (${{ matrix.pass }})
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - pass: suites
            snapshots: "0"
            run: '^(TestSandbox_.*|TestSandboxClasses_.*|TestNodeAgentMTLS_.*|TestPhase2_.*|TestPhase3_UpgradeFromPhase2|TestEgress_.*|TestRuntimeBackends_.*|TestSession_(WorkspaceSurvivesPodKill|ReattachByHandle)|TestSessionExec_.*)$'
            # No skip. kata-qemu is prepared out of band by the step above,
            # the way a customer running runtimes.kata-qemu.install=false does,
            # so TestRuntimeBackends_Smoke/backend=kata-qemu runs for real
            # rather than self-skipping on a missing capability label (setec#93).
            skip: ''
          # Not in this pass, by owner decision 2026-09-28 (both post-launch):
          #   - TestPhase3_PoolWarmStartLifecycle and
          #     TestGate_UnverifiedWarmStartFailsClosed: the warm pool has
          #     never booted an entry (setec#103).
          #   - TestPhase3_SnapshotRoundtrip,
          #     TestPhase3_RestoredClonesDivergeInRNG and
          #     TestPhase3_RestoredClonesHaveUniqueIdentity: nothing calls
          #     restore, and Firecracker cannot load a snapshot into a VM
          #     kata has booted (setec#105).
          # Add each back with its work.
          - pass: phase3
            snapshots: "1"
            run: '^TestPhase3_(PauseResume|SnapshotTTL|StorageFillProtection)$'
            skip: ''
    env:
      KIND_CLUSTER: setec-kvm
      # The worker is the one node that hosts microVMs (hack/kind-kvm.yaml).
      KVM_NODE: setec-kvm-worker
      # A throwaway cluster that exists only for this job. Naming a context
      # would add nothing, so consent is explicit instead (setec#298).
      SETEC_E2E_ALLOW_ANY_CLUSTER: "1"
      SETEC_E2E_RUNTIMECLASS: kata-fc
      # kata-fc's session workspace PVC is volumeMode: Block (setec#91):
      # Firecracker has no virtio-fs, so a filesystem-mode volume's guest
      # writes never reach the PVC. kind's default StorageClass
      # (rancher.io/local-path) provisions Filesystem-mode volumes only,
      # so the "Provision Block-mode PersistentVolumes" step below hand-
      # provisions a small pool of Block-mode local PersistentVolumes
      # under this StorageClass name instead, and the session scenarios
      # (test/e2e/session_lifecycle_test.go and friends) request it by
      # name via this variable.
      SETEC_E2E_WORKSPACE_STORAGE_CLASS: setec-e2e-workspace-block
      # Full reference for the "Import setec-keepalive" step below.
      KEEPALIVE_IMAGE: ${{ needs.build-images.outputs.keepalive_image_repo }}:${{ needs.build-images.outputs.sha_tag }}
      # This build's images, pulled from ghcr (the packages are public).
      SETEC_E2E_IMAGE_TAG: ${{ needs.build-images.outputs.sha_tag }}
      SETEC_E2E_IMAGE_PULL_POLICY: IfNotPresent
      SETEC_E2E_IMAGE_REPO: ghcr.io/zeroroot-ai/setec
      SETEC_E2E_RUNTIME_AGENT_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-runtime-agent
      SETEC_E2E_NODE_AGENT_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-node-agent
      # setec's own installer prepares the node: kata payload, devmapper
      # thin-pool, containerd registration (ADR-0143). There is no kata-deploy
      # on this cluster, so the installer runs in full mode.
      SETEC_E2E_INSTALLER: "1"
      SETEC_E2E_INSTALLER_IMAGE_REPO: ghcr.io/zeroroot-ai/setec-installer
      # The cluster is isolated, so the webhook stays on. A dead run cannot
      # fail anyone else's Sandbox writes closed.
      SETEC_E2E_WEBHOOK: "1"
      # Chart overrides for this cluster, appended to every pass's install:
      #   - pin the installer to the worker, so it never restarts containerd
      #     under the API server on the control-plane node.
      #   - a 20 GiB sparse thin-pool instead of 50. The runner disk is small,
      #     and the scenarios write far less than that.
      #   - a 30s runtime-agent probe interval instead of 5m. The agent's
      #     first probe can land before the installer registers kata-fc, and
      #     the label then waits one interval. TestEnv_KVMPresent waits 3m.
      # sessionKeepalive.image.* pin every kata-fc session's boot binary
      # to THIS build (setec#91): the chart's own default points at a
      # released tag, and this is the first time any e2e scenario boots
      # that binary at all — until now only a spec.command-less session
      # used it, and no such scenario runs here.
      NODE_SET: >-
        installer.nodeSelector.setec\.zeroroot\.ai/e2e-role=sandbox-host,installer.thinpool.loopDataSizeGB=20,defaults.runtime.probeInterval=30s,sessionKeepalive.image.repository=${{ needs.build-images.outputs.keepalive_image_repo }},sessionKeepalive.image.tag=${{ needs.build-images.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Make /dev/kvm usable
        # The runner's /dev/kvm is root:kvm 0660. The worker node mounts the
        # runner's /dev, so it sees this mode. The ioctl proves the device
        # answers, not only that it is present.
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          grep -E '^kvm_(intel|amd) ' /proc/modules
          sudo chmod 666 /dev/kvm
          python3 - <<'PY'
          import fcntl, os
          fd = os.open("/dev/kvm", os.O_RDWR)
          version = fcntl.ioctl(fd, 0xAE00)  # KVM_GET_API_VERSION
          print("KVM API version:", version)
          assert version == 12, "unexpected KVM API version"
          PY

      - name: Create the kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          config: hack/kind-kvm.yaml
          # No CNI yet, so no node can be Ready. The next step waits.
          wait: 0s

      - name: Install Calico
        # hack/kind-kvm.yaml says why the cluster runs Calico and not
        # kindnet. The manifest is pinned by tag and by SHA-256.
        env:
          CALICO_VERSION: v3.32.2
          CALICO_SHA256: a8c828a06a87c629a282ebbc424895b77f3a030251993e41ea400a743675bb02
        run: |
          set -euo pipefail
          curl -fsSL -o calico.yaml \
            "https://raw.githubusercontent.com/projectcalico/calico/${CALICO_VERSION}/manifests/calico.yaml"
          echo "${CALICO_SHA256}  calico.yaml" | sha256sum -c
          kubectl apply -f calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s

      - name: Prepare the worker node
        # Five facts about a kind node that a real node does not share:
        #
        #   - /dev/kvm must be visible inside the node container. The check
        #     here fails the job with a clear message if it is not.
        #   - The kind image builds containerd without the devmapper
        #     snapshotter, and kata-fc needs it: Firecracker takes a block
        #     device per container rootfs. So the worker gets the upstream
        #     containerd release of the same version, checked against its
        #     published SHA-256. Upstream builds include devmapper. The
        #     installer then refuses to report converged on a containerd
        #     that did not load it.
        #   - No udev runs inside the node container. The worker mounts the
        #     runner's /dev (hack/kind-kvm.yaml says why), but the runner's
        #     udev cannot finish a device-mapper handshake that starts in the
        #     node's IPC namespace, so nothing creates /dev/mapper/<name>.
        #     containerd then reports the thin-pool as "Device does not
        #     exist", and a failed devmapper plugin takes containerd's
        #     metadata store down with it. DM_DISABLE_UDEV=1 makes
        #     libdevmapper create the /dev/mapper nodes itself, for
        #     containerd and for the installer's thin-pool unit.
        #   - The kind image ships /etc/containerd as 0644, with no execute
        #     bit. The runtime-agent runs as non-root and cannot traverse
        #     into the directory to read the containerd config, so it would
        #     never label the node kata-fc capable. Real nodes ship 0755.
        #   - gVisor is bring-your-own. The installer lays down kata only,
        #     and TestRuntimeBackends_* boot a gvisor Sandbox beside the
        #     kata-fc one, and fall back to gvisor when kata-fc is gone.
        #     runsc itself comes from the installer now (setec#89), pinned by
        #     gvisor.env, so this step no longer installs it.
        run: |
          set -euo pipefail
          docker exec "${KVM_NODE}" test -c /dev/kvm || {
            echo "::error::/dev/kvm is not a character device inside ${KVM_NODE}"
            exit 1
          }
          docker exec "${KVM_NODE}" ls -l /dev/kvm
          docker exec "${KVM_NODE}" chmod 0755 /etc/containerd
          for unit in containerd.service setec-thinpool.service; do
            docker exec "${KVM_NODE}" sh -c "mkdir -p /etc/systemd/system/${unit}.d && printf '[Service]\nEnvironment=DM_DISABLE_UDEV=1\n' > /etc/systemd/system/${unit}.d/05-dm-disable-udev.conf"
          done
          docker exec "${KVM_NODE}" systemctl daemon-reload

          version="$(docker exec "${KVM_NODE}" containerd --version | awk '{print $3}')"
          version="${version#v}"
          echo "kind node containerd: ${version}"
          cdir="$(mktemp -d)"
          tarball="containerd-${version}-linux-amd64.tar.gz"
          curl -fsSL -o "${cdir}/${tarball}" \
            "https://github.com/containerd/containerd/releases/download/v${version}/${tarball}"
          curl -fsSL -o "${cdir}/${tarball}.sha256sum" \
            "https://github.com/containerd/containerd/releases/download/v${version}/${tarball}.sha256sum"
          (cd "${cdir}" && sha256sum -c "${tarball}.sha256sum")
          tar -xzf "${cdir}/${tarball}" -C "${cdir}" bin/containerd
          docker cp "${cdir}/bin/containerd" "${KVM_NODE}:/usr/local/bin/containerd"

          # gVisor is NOT laid here any more. The setec installer lays it, from
          # the gvisor.env pin, as part of normal node preparation (setec#89) —
          # so this job no longer has its own copy of that logic, and the
          # existing gvisor scenarios are what prove the installer did it.
          #
          # This block also fetched from the release bucket's `latest`, so CI
          # could drift onto a new gVisor on any run. scripts/check-runtime-pins.sh
          # now fails on exactly that pattern.
          # discard_unpacked_layers = false here, before this node ever pulls
          # any image, not only in the installer's own drop-in it writes
          # later (setec#91): setec's own images (manager, runtime-agent,
          # node-agent) share layers with setec-keepalive (same distroless
          # base), and the guard's own Helm install pulls the first of them
          # concurrently with the installer converging. Left at the kind
          # image's default (true) for even that first pull, containerd
          # discards the shared layer content right after unpacking it into
          # the default snapshotter, and no later config change un-discards
          # it: every subsequent devmapper unpack of the same shared layer
          # (any kata-fc session on this backend, since setec-keepalive is
          # the workspace-format binary now) fails with "failed to get
          # reader from content store ... not found" for the rest of the
          # job. Set here, before that first pull happens, not after — as
          # its own config.d drop-in (the kind image's stock config.toml
          # already declares [plugins."...".containerd], so appending a
          # second copy of that same table header is invalid TOML; the
          # installer's own ensureImportsLine treats an existing glob entry
          # as a no-op, so this and the installer's later identical drop-in
          # never conflict).
          docker exec "${KVM_NODE}" sh -c 'set -e
            mkdir -p /etc/containerd/config.d
            cat > /etc/containerd/config.d/00-keep-unpacked-layers.toml <<EOF
          [plugins."io.containerd.grpc.v1.cri".containerd]
            discard_unpacked_layers = false
          EOF
            grep -q "config.d/\*.toml" /etc/containerd/config.toml || sed -i "1i imports = [\"/etc/containerd/config.d/*.toml\"]" /etc/containerd/config.toml'
          docker exec "${KVM_NODE}" sh -c 'cat >> /etc/containerd/config.toml <<EOF

          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runsc]
            runtime_type = "io.containerd.runsc.v1"
          EOF'
          docker exec "${KVM_NODE}" systemctl restart containerd
          kubectl wait --for=condition=Ready "node/${KVM_NODE}" --timeout=120s
          docker exec "${KVM_NODE}" crictl info | grep -q '"runsc"' || {
            echo "::error::containerd on ${KVM_NODE} did not register the runsc handler"
            exit 1
          }
          # The plugin reports "skip" until the installer configures a pool.
          # Present is what this step can prove.
          docker exec "${KVM_NODE}" ctr plugins ls | grep -E 'io\.containerd\.snapshotter\.v1 +devmapper ' || {
            echo "::error::containerd on ${KVM_NODE} has no devmapper snapshotter plugin"
            exit 1
          }

      - name: Provision Block-mode PersistentVolumes for kata-fc session workspaces
        # setec#91: kata-fc's session workspace PVC is volumeMode: Block, and
        # kind's default StorageClass (rancher.io/local-path) cannot provision
        # one. This is the standard Kubernetes static "local volume" recipe —
        # no extra controller needed for a cluster that lives one job run:
        # a handful of loop devices, one PersistentVolume each, and a
        # StorageClass that names no provisioner because nothing dynamic ever
        # provisions against it.
        #
        # The loop devices are created on the RUNNER, not inside `docker exec
        # ${KVM_NODE}`: hack/kind-kvm.yaml bind-mounts the runner's real /dev
        # into the worker node (the same reason containerd's devmapper
        # /dev/dm-<n> nodes are visible to it), so a /dev/loopN attached here
        # appears inside the node's container under the identical path.
        #
        # Six volumes: the suite's session scenarios in this pass
        # (TestSession_WorkspaceSurvivesPodKill, TestSession_ReattachByHandle,
        # and the three TestSessionExec_* scenarios launchSession starts) each
        # create exactly one session Sandbox and run strictly sequentially, so
        # five distinct never-reused PVs is the true minimum; one spare avoids
        # a retry starving the pool. 1200Mi each clears the 1Gi every scenario
        # requests with room for the ext4 filesystem's own overhead.
        run: |
          set -euo pipefail
          node_name="${KVM_NODE}"
          backing_dir="/var/lib/setec-e2e-block-pv"
          sudo mkdir -p "${backing_dir}"
          for i in 0 1 2 3 4 5; do
            img="${backing_dir}/vol${i}.img"
            sudo truncate -s 1200M "${img}"
            dev="$(sudo losetup --show -f "${img}")"
            echo "loop device ${i}: ${dev} (${img})"
            docker exec "${KVM_NODE}" test -b "${dev}" || {
              echo "::error::${dev} is not visible as a block device inside ${KVM_NODE}"
              exit 1
            }
            cat <<PV | kubectl apply -f -
          apiVersion: v1
          kind: PersistentVolume
          metadata:
            name: setec-e2e-workspace-block-${i}
          spec:
            capacity:
              storage: 1200Mi
            volumeMode: Block
            accessModes:
              - ReadWriteOnce
            persistentVolumeReclaimPolicy: Retain
            storageClassName: ${SETEC_E2E_WORKSPACE_STORAGE_CLASS}
            local:
              path: ${dev}
            nodeAffinity:
              required:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - ${node_name}
          PV
          done
          cat <<SC | kubectl apply -f -
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: ${SETEC_E2E_WORKSPACE_STORAGE_CLASS}
          provisioner: kubernetes.io/no-provisioner
          volumeBindingMode: WaitForFirstConsumer
          SC
          kubectl get pv -o wide
          kubectl get storageclass "${SETEC_E2E_WORKSPACE_STORAGE_CLASS}"

      - name: Create the chart's RuntimeClasses
        # The suite requires the RuntimeClass to exist before it installs,
        # and installs with runtimes.<backend>.install=false. So the objects
        # come from the chart's own template, rendered here with install=true,
        # and are identical to what a default install renders. The values
        # besides the runtimes only satisfy the chart's render guards.
        run: |
          set -euo pipefail
          helm template rc ./charts/setec \
            --show-only templates/runtime-classes.yaml \
            --set webhook.enabled=false \
            --set 'sandboxNamespaces={render-only}' \
            --set runtimes.kata-fc.install=true \
            --set runtimes.gvisor.enabled=true \
            --set runtimes.gvisor.install=true \
            | kubectl apply -f -
          kubectl get runtimeclass

      - name: Lay the kata-qemu handler out of band
        # setec#93. The installer image carries the kata-fc payload only:
        # Dockerfile.installer prunes the QEMU/CLH/TDX/SNP/NVIDIA variants
        # because they "would quintuple the image for nothing", and setec#284
        # pruned kata-runtime out for the same reason — image weight shipped to
        # every sandbox host.
        #
        # So this job prepares kata-qemu the way a CUSTOMER does, out of band,
        # which is the documented `runtimes.kata-qemu.install=false` path. That
        # gives the README's four-backend claim a real test without putting
        # ~200 MB of QEMU into an image every node pulls.
        #
        # The full upstream tarball is fetched here (not the pruned payload) and
        # only the qemu pieces are kept. Same pin as the installer, from
        # kata.env, so the two can never test different kata releases.
        env:
          KATA_VERSION: ${{ needs.build-images.outputs.kata_version }}
        run: |
          set -euo pipefail
          test -n "${KATA_VERSION}" || { echo "::error::KATA_VERSION is empty; the kata pin did not reach this job"; exit 1; }

          work="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$work/kata.tar.zst" \
            "https://github.com/kata-containers/kata-containers/releases/download/${KATA_VERSION}/kata-static-${KATA_VERSION}-amd64.tar.zst"

          # runtime-rs (kata-static) ships the QEMU hypervisor; the go-static
          # tarball the installer uses does not. Extract into the node at the
          # same /opt/kata root the kata-fc payload already occupies, so one
          # configuration tree serves both handlers.
          # The drop-in is written here, on the runner, and copied in. Composing
          # it inside the `docker exec ... bash -c` string below would nest
          # single quotes inside single quotes and silently terminate the outer
          # one (actionlint SC1012 caught exactly that in the first draft).
          #
          # containerd 2.x plugin path. The 1.x io.containerd.grpc.v1.cri table
          # is SILENTLY IGNORED by a 2.x containerd: the stanza is present,
          # containerd starts clean, and kubelet then fails the pod with no
          # runtime configured. The installer gets this right for kata-fc.
          cat >"$work/20-kata-qemu.toml" <<'TOML'
          [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata-qemu]
            runtime_type = "io.containerd.kata-qemu.v2"
            privileged_without_host_devices = true
            pod_annotations = ["io.katacontainers.*"]
            [plugins."io.containerd.cri.v1.runtime".containerd.runtimes.kata-qemu.options]
              ConfigPath = "/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-runtime-rs.toml"
          TOML
          sed -i 's/^          //' "$work/20-kata-qemu.toml"

          # Not /tmp. A kind node mounts a tmpfs on /tmp, and `docker cp`
          # writes to the container filesystem under that mount, so the copy
          # succeeds and the file is not there for anything that runs inside
          # the node. The first run that reached this step failed on exactly
          # that: "tar: /tmp/kata-qemu.tar.zst: Cannot open".
          prep=/var/lib/setec-e2e
          docker exec "${KIND_CLUSTER}-worker" mkdir -p "$prep"
          docker cp "$work/kata.tar.zst" "${KIND_CLUSTER}-worker:$prep/kata-qemu.tar.zst"
          docker cp "$work/20-kata-qemu.toml" "${KIND_CLUSTER}-worker:$prep/20-kata-qemu.toml"
          docker exec "${KIND_CLUSTER}-worker" bash -euo pipefail -c '
            prep=/var/lib/setec-e2e
            test -s "$prep/kata-qemu.tar.zst" && test -s "$prep/20-kata-qemu.toml" \
              || { echo "the kata archive or the containerd drop-in did not reach the node" >&2; exit 1; }
            command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; }
            # The kata 4.x kata-static archive is runtime-rs only. Its QEMU
            # configuration is runtime-rs/configuration-qemu-runtime-rs.toml and
            # its shim is /opt/kata/runtime-rs/bin/containerd-shim-kata-v2. The
            # first draft of this step asked for configuration-qemu.toml and
            # linked the Go shim of the kata-fc payload, a layout this archive
            # never had. It also fell back to extracting all of ./opt/kata with
            # the error output discarded, which hid that.
            #
            # Named members only, no fallback: a member this archive does not
            # have fails here with tar naming it. The kernel and the guest
            # image are the same files the kata-fc payload ships, from the same
            # pin, so writing them again changes nothing.
            cfg=/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-runtime-rs.toml
            shim=/opt/kata/runtime-rs/bin/containerd-shim-kata-v2
            share=/opt/kata/share/kata-containers
            tar --zstd -xf "$prep/kata-qemu.tar.zst" -C / \
              ./opt/kata/bin/qemu-system-x86_64 \
              ./opt/kata/share/kata-qemu \
              ./opt/kata/libexec/virtiofsd \
              ./opt/kata/runtime-rs/bin/containerd-shim-kata-v2 \
              ./opt/kata/share/defaults/kata-containers/runtime-rs/configuration-qemu-runtime-rs.toml \
              ./opt/kata/share/kata-containers/vmlinux.container \
              ./opt/kata/share/kata-containers/kata-containers.img
            # The kernel and the image are symlinks to versioned files. Their
            # targets are read from the node, so no file name of one kata
            # release is written here.
            tar --zstd -xf "$prep/kata-qemu.tar.zst" -C / \
              "./opt/kata/share/kata-containers/$(readlink "$share/vmlinux.container")" \
              "./opt/kata/share/kata-containers/$(readlink "$share/kata-containers.img")"
            # Every path the configuration names must exist on the node. A
            # handler that loads and then fails at launch is the failure this
            # step exists to prevent (setec#93).
            for f in "$cfg" "$shim" /opt/kata/bin/qemu-system-x86_64 /opt/kata/libexec/virtiofsd \
                "$share/vmlinux.container" "$share/kata-containers.img"; do
              test -s "$f" || { echo "kata-qemu prep: $f is missing on the node" >&2; exit 1; }
            done
            grep -q "^path = \"/opt/kata/bin/qemu-system-x86_64\"" "$cfg" \
              || { echo "kata-qemu prep: $cfg does not name the QEMU binary this step laid" >&2; exit 1; }

            mkdir -p /etc/containerd/config.d
            cp "$prep/20-kata-qemu.toml" /etc/containerd/config.d/20-kata-qemu.toml
            rm -f "$prep/kata-qemu.tar.zst"
            ln -sf "$shim" /usr/local/bin/containerd-shim-kata-qemu-v2
            systemctl restart containerd
          '

          # Prove containerd actually loaded it. A drop-in that containerd
          # ignored is the failure this whole step exists to avoid, and it is
          # invisible until a Sandbox fails to schedule.
          for i in $(seq 1 30); do
            if docker exec "${KIND_CLUSTER}-worker" crictl info 2>/dev/null | grep -q '"kata-qemu"'; then
              echo "containerd loaded the kata-qemu runtime handler"
              break
            fi
            [ "$i" = "30" ] && { echo "::error::containerd never reported a kata-qemu runtime handler"; docker exec "${KIND_CLUSTER}-worker" crictl info | head -40; exit 1; }
            sleep 2
          done

          # The RuntimeClass, from the chart's own template so it matches a
          # real install, and the capability label the operator requires before
          # it will place a Sandbox on the backend.
          helm template rc ./charts/setec \
            --show-only templates/runtime-classes.yaml \
            --set webhook.enabled=false \
            --set 'sandboxNamespaces={render-only}' \
            --set runtimes.kata-qemu.enabled=true \
            --set runtimes.kata-qemu.install=true \
            | kubectl apply -f -
          kubectl label node "${KIND_CLUSTER}-worker" setec.zeroroot.ai/runtime.kata-qemu=true --overwrite
          kubectl get runtimeclass kata-qemu

      - name: The KVM guard
        env:
          SETEC_E2E_NAMESPACE: setec-e2e-guard
          SETEC_E2E_SANDBOX_NAMESPACE: setec-e2e-guard-sandboxes
          SETEC_E2E_RELEASE: setec-e2e-guard
        run: |
          set +e
          set -uo pipefail
          SETEC_E2E_EXTRA_SET="${NODE_SET}" \
            go test -count=1 -tags=e2e ./test/e2e/... -v -timeout 20m \
            -run '^(TestEnv_KVMPresent|TestInstaller_Converges)$' \
            2>&1 | tee guard.log
          status="${PIPESTATUS[0]}"
          scripts/e2e-summary.sh "The KVM guard" guard.log "$status"

      - name: Import setec-keepalive into containerd's content store directly
        # setec#91: every kata-fc session Sandbox now boots this image's
        # binary — the first time any e2e scenario has pulled a
        # setec-built image into a kata-fc Pod at all (every other
        # kata-fc scenario's workload is a public image such as
        # busybox). Every attempt so far failed unpacking one specific
        # layer into devmapper with "failed to get reader from content
        # store ... not found", including a from-scratch `ctr images
        # pull` run alone with nothing else on the node, and again after
        # setting discard_unpacked_layers=false before this node's first
        # pull (setec#22's fix for a *different* shape of this same
        # error). The layer is real and intact — `docker pull` on an
        # unrelated machine reads it back and verifies its checksum with
        # no issue — so whatever loses it is specific to containerd's
        # own registry-fetch path on this node, not the registry, this
        # image's content, or a stale discard setting.
        #
        # `ctr images import` reads a full OCI/Docker tarball in one
        # local pass instead of streaming layers from a remote registry,
        # a materially different code path in containerd. Streaming the
        # tarball straight from `docker save` on the runner into `ctr
        # images import` on the node over stdin (no intermediate file —
        # a `docker cp` of the same tarball to a file first left `ctr`
        # unable to find it moments later, cause unconfirmed) sidesteps
        # the registry-fetch path entirely; mounting the image afterward
        # (containerd 2.x dropped the old `images unpack` verb — `images
        # mount` unpacks into the named snapshotter as a side effect of
        # mounting, verified locally) only has to read content this same
        # import already committed in full.
        run: |
          set -euo pipefail
          docker pull "${KEEPALIVE_IMAGE}"
          docker save "${KEEPALIVE_IMAGE}" | docker exec -i "${KVM_NODE}" ctr -n k8s.io images import -
          # The guard's installer creates the thin-pool and restarts
          # containerd, and devmapper reports "skip" or an error until it
          # reloads with the pool. Mount only once it reports "ok"
          # (run 36491111490 raced it: "snapshotter not loaded:
          # devmapper: invalid argument").
          for _ in $(seq 1 60); do
            if docker exec "${KVM_NODE}" ctr plugins ls | grep -qE 'io\.containerd\.snapshotter\.v1 +devmapper +\S+ +ok'; then
              break
            fi
            sleep 3
          done
          docker exec "${KVM_NODE}" ctr plugins ls | grep -E 'io\.containerd\.snapshotter\.v1 +devmapper +\S+ +ok' || {
            echo "::error::the devmapper snapshotter on ${KVM_NODE} is not ok after 3 minutes"
            docker exec "${KVM_NODE}" ctr plugins ls | grep devmapper || true
            exit 1
          }
          docker exec "${KVM_NODE}" mkdir -p /tmp/setec-keepalive-mount
          docker exec "${KVM_NODE}" ctr -n k8s.io images mount --snapshotter devmapper "${KEEPALIVE_IMAGE}" /tmp/setec-keepalive-mount
          docker exec "${KVM_NODE}" ctr -n k8s.io images unmount /tmp/setec-keepalive-mount

      - name: The ${{ matrix.pass }} scenarios
        env:
          SETEC_E2E_NAMESPACE: setec-e2e-${{ matrix.pass }}
          SETEC_E2E_SANDBOX_NAMESPACE: setec-e2e-${{ matrix.pass }}-sandboxes
          SETEC_E2E_RELEASE: setec-e2e-${{ matrix.pass }}
          SETEC_E2E_SNAPSHOTS: ${{ matrix.snapshots }}
          RUN_PATTERN: ${{ matrix.run }}
          SKIP_PATTERN: ${{ matrix.skip }}
          PASS: ${{ matrix.pass }}
        run: |
          set +e
          set -uo pipefail
          extra_set="${NODE_SET}"
          sampler=""
          # kubectl logs cannot read a kata-fc container's output on this
          # kind + nested-KVM cluster, and the controller replaces a failed
          # session Pod within seconds. crictl reads the log file on the
          # node directly, so poll each session Pod for container IDs and
          # dump each one the moment it appears (setec#91).
          session_pod_names="e2e-session e2e-reattach e2e-exec-reattach e2e-exec-false e2e-exec-kill"
          (
            declare -A seen_ids
            while true; do
              for sb in ${session_pod_names}; do
                pod="${sb}-vm"
                statuses="$(kubectl get pod -n "${SETEC_E2E_SANDBOX_NAMESPACE}" "${pod}" \
                  -o jsonpath='{range .status.initContainerStatuses[*]}{.name}{"\t"}{.containerID}{"\n"}{end}{range .status.containerStatuses[*]}{.name}{"\t"}{.containerID}{"\n"}{end}' \
                  2>/dev/null)"
                [ -z "${statuses}" ] && continue
                while IFS=$'\t' read -r cname cid; do
                  [ -z "${cid}" ] && continue
                  short="${cid#containerd://}"
                  key="${pod}/${cname}/${short}"
                  [ -n "${seen_ids[${key}]:-}" ] && continue
                  seen_ids["${key}"]=1
                  out="$(docker exec "${KVM_NODE}" crictl logs "${short}" 2>&1)"
                  printf '%s\n--- %s -c %s (container %s) ---\n%s\n' \
                    "$(date -u +%H:%M:%S.%N)" "${pod}" "${cname}" "${short:0:12}" "${out}"
                done <<< "${statuses}"
              done
              sleep 1
            done
          ) > session-pods.log &
          session_sampler=$!
          if [ "${SETEC_E2E_SNAPSHOTS}" = "1" ]; then
            # The node-agent takes the Firecracker snapshots. The chart pins
            # it to kata-deploy's node label, which this cluster does not
            # carry, so the selector moves to the worker.
            extra_set="${extra_set},nodeAgent.enabled=true,nodeAgent.image.repository=${SETEC_E2E_NODE_AGENT_IMAGE_REPO},nodeAgent.image.tag=${SETEC_E2E_IMAGE_TAG},nodeAgent.nodeSelector.katacontainers\.io/kata-runtime=null,nodeAgent.nodeSelector.setec\.zeroroot\.ai/e2e-role=sandbox-host"
            # TestMain uninstalls the release on the way out, so the logs of
            # the node-agent and the operator, the two halves of a snapshot,
            # are gone by the time a diagnostics step could read them.
            # Sample them while the pass runs. Each sample takes every line
            # of the last minute (--since), not the last 60 lines: with
            # --tail a busy minute dropped the lines that explained a
            # failure (setec#19, roundtrip-snap never went Ready). The
            # 5 s overlap may repeat a line but never skips one.
            (
              while sleep 60; do
                echo "--- $(date -u +%H:%M:%S)"
                kubectl logs -n "${SETEC_E2E_NAMESPACE}" -l app.kubernetes.io/component=node-agent \
                  --all-containers --previous --tail=60 2>&1
                kubectl logs -n "${SETEC_E2E_NAMESPACE}" -l app.kubernetes.io/component=node-agent \
                  --all-containers --since=65s --tail=-1 --prefix 2>&1
                kubectl logs -n "${SETEC_E2E_NAMESPACE}" -l app.kubernetes.io/component=operator \
                  --all-containers --since=65s --tail=-1 --prefix 2>&1
              done
            ) > node-agent.log &
            sampler=$!
          fi
          skip_args=()
          if [ -n "${SKIP_PATTERN}" ]; then
            skip_args=(-skip "${SKIP_PATTERN}")
          fi
          SETEC_E2E_EXTRA_SET="${extra_set}" \
            go test -count=1 -tags=e2e ./test/e2e/... -v -timeout 70m \
            -run "${RUN_PATTERN}" "${skip_args[@]}" \
            2>&1 | tee "${PASS}.log"
          status="${PIPESTATUS[0]}"
          [ -n "${sampler}" ] && kill "${sampler}" 2>/dev/null
          kill "${session_sampler}" 2>/dev/null
          scripts/e2e-summary.sh "The ${PASS} scenarios" "${PASS}.log" "$status"

      - name: Collect diagnostics
        if: failure()
        run: |
          set -uo pipefail
          echo "::group::session-pods.log (crictl sampler)"
          cat session-pods.log 2>/dev/null || echo "session-pods.log missing"
          echo "::endgroup::"
          kubectl get nodes -o wide --show-labels || true
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.metadata.annotations.setec\.zeroroot\.ai/runtime-probe}{"\n"}{end}' || true
          kubectl get runtimeclass,sandboxclasses -o wide || true
          kubectl get pv,storageclass -o wide || true
          kubectl get pvc -A -o wide || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          echo "::group::containerd on ${KVM_NODE}"
          docker exec "${KVM_NODE}" journalctl -u containerd --no-pager | tail -200 || true
          echo "::endgroup::"
          echo "::group::thin-pool on ${KVM_NODE}"
          docker exec "${KVM_NODE}" journalctl -u setec-thinpool --no-pager | tail -50 || true
          docker exec "${KVM_NODE}" dmsetup ls || true
          docker exec "${KVM_NODE}" ls -l /dev/mapper || true
          docker exec "${KVM_NODE}" ctr plugins ls || true
          docker exec "${KVM_NODE}" journalctl -u containerd --no-pager | grep -iE 'devmapper|failed to load plugin' | tail -40 || true
          docker exec "${KVM_NODE}" losetup -a || true
          echo "::endgroup::"

      - name: Upload the test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ matrix.pass }}-logs
          path: |
            guard.log
            ${{ matrix.pass }}.log
            node-agent.log
            session-pods.log
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # notify-suites — make a red nightly loud.
  #
  # `suites` runs on a schedule, and a scheduled workflow that fails is the
  # quietest thing in GitHub: no PR turns red, no merge is blocked, and the
  # only trace is a row in a list nobody opens. That is the same failure mode
  # as the suite having no runner at all (setec#298), one step removed, so
  # the run files its own report.
  #
  # Deduplicated by a marker in the title: a suite that stays broken for a
  # week updates one issue rather than opening seven.
  # ----------------------------------------------------------------------
  notify-suites:
    needs: suites
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'e2e: the nightly `suites` run is failing'
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open \
            --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')"
          # printf rather than a heredoc: a heredoc terminator must sit at
          # column 0, and a line at column 0 would end this YAML block scalar.
          # Leading whitespace also has to stay out of the body itself — an
          # indented line renders as a code block in a GitHub issue.
          body="$(printf '%s\n' \
            "The nightly \`e2e / suites\` run failed: ${RUN_URL}" \
            "" \
            "These are the Go e2e scenarios that had no runner before setec#298 — the" \
            "ADR-0145 invariants, egress confinement, the phase2/phase3 lifecycle, and" \
            "the \`TestEnv_KVMPresent\` guard. A red run here means one of those" \
            "invariants is unverified, not that CI is untidy." \
            "" \
            "Check the job summary for the PASS/FAIL/SKIP list before triaging: a SKIP" \
            "is also a failure of coverage, and the run warns on one.")"
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${body}"
          fi
