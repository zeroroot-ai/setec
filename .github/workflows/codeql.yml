# SPDX-License-Identifier: Apache-2.0
#
# The scan is the shared workflow of zeroroot-ai/.github (ADR-0018, D38). It
# runs the suite security-extended and the custom Go queries of the
# organization. This repo keeps no CodeQL config file and no query list
# (setec#241).
#
# Triggers: merge_group is the gate before a merge. A push to main sends the
# result for refs/heads/main to code scanning, so an alert closes when its
# fix merges, not at the next weekly run. The weekly run on Tuesday at
# 08:00 UTC is the deep scan. workflow_dispatch forces a scan on demand.
#
# The merge_group run does not upload. Its temporary gh-readonly-queue ref is
# often gone before the upload call, which then fails with "ref not found".
# The scan still runs, so an extraction or query error still fails the gate.
name: CodeQL

on:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@7ca10753e23be732df39f4db48af0b9edcfea2b5 # v0.19.2
    with:
      languages: '["go"]'
      go-build-command: go build ./...
      upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
      paths-ignore: |
        **/zz_generated*.go
        **/*.pb.go
        **/*_grpc.pb.go
        **/testdata/**
