# SPDX-License-Identifier: Apache-2.0
#
# The scan is the shared workflow of zeroroot-ai/.github (ADR-0018, D38). It
# runs the suite security-extended and the custom Go queries of the
# organization. This repo keeps no CodeQL config file and no query list
# (setec#241).
#
# Triggers: merge_group is the gate before a merge, and the weekly run on
# Tuesday at 08:00 UTC sends the result to code scanning. workflow_dispatch
# forces a scan of main on demand, so that a fixed alert closes before the
# next weekly run.
#
# The merge_group run does not upload. Its temporary gh-readonly-queue ref is
# often gone before the upload call, which then fails with "ref not found".
# The scan still runs, so an extraction or query error still fails the gate.
name: CodeQL

on:
  merge_group:
  schedule:
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@96b8fa3f95163ce097194672a80f1317830503d4 # v0.17.5
    with:
      languages: '["go"]'
      go-build-command: go build ./...
      upload: ${{ github.event_name == 'merge_group' && 'never' || 'always' }}
      paths-ignore: |
        **/zz_generated*.go
        **/*.pb.go
        **/*_grpc.pb.go
        **/testdata/**
