name: images

# Builds + pushes setec, setec-node-agent, setec-frontend,
# setec-runtime-agent, setec-guest-agent, setec-keepalive, and
# setec-installer to GHCR.
# Adopts the org reusable image-build workflow (slice 1.2, .github#47).
#
# All service images share a single Dockerfile; CMD build-arg selects the
# binary. setec-installer builds from Dockerfile.installer instead: it
# additionally bundles the pinned kata-containers static release as an
# immutable payload (ADR-0143, setec#187) and is amd64-only — the kata
# payload is x86 (ADR-0141) and the chart's installer DaemonSet pins
# kubernetes.io/arch: amd64.
# setec-guest-agent is not a runnable service image: it exists so microVM
# rootfs builders can COPY the static binary out of it (the in-guest half
# of the entropy reseed on snapshot restore, setec#72).
# setec-keepalive is the boot command of a session Sandbox that declares
# no spec.command (setec#7): the operator runs it as an init container that
# installs the static binary into a shared volume.
# The smoke-test gate and draft GitHub Release creation live in release.yml.
# Example Dockerfiles under examples/ are NOT published as releases (skipped).
#
# Version tags (setec#131): release-please pushes its tags with the default
# GITHUB_TOKEN, which never fires the `push: tags:` trigger below (GitHub
# anti-recursion). release-please.yml therefore calls this workflow via
# workflow_call in the same run and passes the fresh tag as version_tag.
# The tags trigger + tag_pattern remain for hand-pushed tags (which DO fire).
#
# Images are single-arch linux/amd64 ONLY (ADR-0141, setec#186): the sandbox
# substrate is x86 exclusively, so no multi-arch manifests are published and
# nothing silently attempts arm64. This supersedes the brief multi-arch
# window opened for setec#132 — mixed-arch clusters converge via the
# kubernetes.io/arch=amd64 selectors the chart now hardcodes, not via arm64
# images. hack/verify-x86-substrate.sh guards these platforms lines;
# re-adding arm64 requires a new ADR.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version_tag:
        required: false
        type: string
        default: ""
        description: Explicit version tag (e.g. v0.106.0) to add to every image.

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # kata.env and gvisor.env at the repo root are the one place each runtime
  # release is pinned (setec#26, setec#89). This job reads them once;
  # setec-installer passes the four values as build args, because
  # Dockerfile.installer's ARGs carry no default on purpose.
  # scripts/check-runtime-pins.sh keeps it that way.
  kata-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.read.outputs.version }}
      sha256: ${{ steps.read.outputs.sha256 }}
      gvisor_version: ${{ steps.read.outputs.gvisor_version }}
      gvisor_sha256: ${{ steps.read.outputs.gvisor_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard the pins and read kata.env + gvisor.env
        id: read
        run: |
          set -euo pipefail
          bash scripts/check-runtime-pins.sh
          . ./kata.env
          . ./gvisor.env
          {
            echo "version=${KATA_VERSION}"
            echo "sha256=${KATA_SHA256}"
            echo "gvisor_version=${GVISOR_VERSION}"
            echo "gvisor_sha256=${GVISOR_SHA256}"
          } >> "$GITHUB_OUTPUT"

  setec:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=manager

  setec-node-agent:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-node-agent
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-node-agent
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=node-agent

  setec-frontend:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-frontend
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-frontend
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=frontend

  setec-runtime-agent:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-runtime-agent
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-runtime-agent
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=runtime-agent

  setec-guest-agent:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-guest-agent
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-guest-agent
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=setec-guest-agent

  setec-keepalive:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@f2ca779edd5461be94bdd0a0762657f85317983e # v0.7.2
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-keepalive
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-keepalive
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=setec-keepalive

  # Pinned AHEAD of the other six image jobs, which stay on v0.7.2, and that is
  # deliberate rather than drift: this is the only job that passes
  # vendored_binaries, so it is the only one that needs a reusable new enough to
  # accept it. Moving the other six is a separate change with its own blast radius
  # and no reason to ride along here.
  setec-installer:
    needs: kata-pin
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-installer
      component_path: .
      dockerfile_path: Dockerfile.installer
      image_name: ghcr.io/zeroroot-ai/setec-installer
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      # amd64 only: the bundled kata static payload is x86 (ADR-0141).
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      # Binaries this repo does NOT compile, so the vulnerability gate asks
      # REACHABILITY for them instead of staleness (.github#163, v0.8.3).
      #
      # Why these five. A Go stdlib finding from an image scanner is a version
      # comparison: the binary's Go is behind a patch. For a binary we build that
      # is the right question, because bumping Go is ours to do. For these it is
      # the wrong question and has no remedy — gVisor publishes every artifact
      # built with the Go its own go.mod names (MODULE.bazel takes the SDK from
      # it), so release-20260928.0, the GCS bucket, the bucket's latest and even
      # the nightly built on 2026-10-02 are all go1.26.3. That produced 11 fixable
      # HIGH stdlib findings setec could not act on in any way, and v0.117.0
      # shipped a git tag and a published chart with NO installer image.
      #
      # This is NOT an allowlist. govulncheck -mode=binary reports a vulnerability
      # only when the affected SYMBOL is in the binary; a reachable finding still
      # blocks, and an analysis that does not run blocks. Checked before relying
      # on it: these binaries are not stripped (runsc 67589 readable symbols,
      # gvisor_sentry 63318), so binary mode runs at full precision rather than
      # degrading to a module-level guess.
      #
      # Paths are as trivy names its Target: no leading slash. A path that is not
      # in the image fails loudly rather than quietly tolerating anything — the
      # collector writes .failed when docker cp misses, and .failed blocks.
      #
      # firecracker and jailer are deliberately absent: they are Rust, so they
      # carry no Go stdlib to compare.
      vendored_binaries: |
        opt/gvisor/runsc
        opt/gvisor/containerd-shim-runsc-v1
        opt/gvisor/gvisor-bin/gvisor_sentry
        opt/kata/bin/containerd-shim-kata-v2
      build_args: |
        KATA_VERSION=${{ needs.kata-pin.outputs.version }}
        KATA_SHA256=${{ needs.kata-pin.outputs.sha256 }}
        GVISOR_VERSION=${{ needs.kata-pin.outputs.gvisor_version }}
        GVISOR_SHA256=${{ needs.kata-pin.outputs.gvisor_sha256 }}
