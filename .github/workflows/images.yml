name: images

# Builds + pushes setec, setec-node-agent, setec-frontend,
# setec-device-plugin, setec-launcher and setec-disk-builder to GHCR.
# Adopts the org reusable image-build workflow (slice 1.2, .github#47).
#
# The service images share a single Dockerfile; CMD build-arg selects the
# binary. setec-launcher builds from Dockerfile.launcher: it carries
# Firecracker, the guest kernel and the guest agent. setec-disk-builder
# builds from Dockerfile.disk-builder.
# The draft GitHub Release creation lives in release.yml.
# Example Dockerfiles under examples/ are NOT published as releases (skipped).
#
# Version tags (setec#131): release-please pushes its tags with the default
# GITHUB_TOKEN, which never fires the `push: tags:` trigger below (GitHub
# anti-recursion). release-please.yml therefore calls this workflow via
# workflow_call in the same run and passes the fresh tag as version_tag.
# The tags trigger + tag_pattern remain for hand-pushed tags (which DO fire).
#
# Images are single-arch linux/amd64 ONLY (docs/design/runtime.md, setec#186): the sandbox
# substrate is x86 exclusively, so no multi-arch manifests are published and
# nothing silently attempts arm64. This supersedes the brief multi-arch
# window opened for setec#132 — mixed-arch clusters converge via the
# kubernetes.io/arch=amd64 selectors the chart now hardcodes, not via arm64
# images. hack/verify-x86-substrate.sh guards these platforms lines;
# re-adding arm64 requires a new ADR.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version_tag:
        required: false
        type: string
        default: ""
        description: Explicit version tag (e.g. v0.106.0) to add to every image.

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # firecracker.env at the repo root is the one place the Firecracker
  # release is pinned. This job reads it once; setec-launcher passes the two
  # values as build args, because Dockerfile.launcher's ARGs carry no default
  # on purpose. scripts/check-runtime-pins.sh keeps it that way.
  runtime-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      firecracker_version: ${{ steps.read.outputs.firecracker_version }}
      firecracker_sha256: ${{ steps.read.outputs.firecracker_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Guard the pins and read firecracker.env
        id: read
        run: |
          set -euo pipefail
          bash scripts/check-runtime-pins.sh
          . ./firecracker.env
          {
            echo "firecracker_version=${FIRECRACKER_VERSION}"
            echo "firecracker_sha256=${FIRECRACKER_SHA256}"
          } >> "$GITHUB_OUTPUT"

  setec:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=manager

  setec-node-agent:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-node-agent
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-node-agent
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=node-agent

  setec-frontend:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-frontend
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-frontend
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=frontend

  setec-device-plugin:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-device-plugin
      component_path: .
      dockerfile_path: Dockerfile
      image_name: ghcr.io/zeroroot-ai/setec-device-plugin
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        CMD=setec-device-plugin

  setec-launcher:
    needs: runtime-pin
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-launcher
      component_path: .
      dockerfile_path: Dockerfile.launcher
      image_name: ghcr.io/zeroroot-ai/setec-launcher
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
      build_args: |
        FIRECRACKER_VERSION=${{ needs.runtime-pin.outputs.firecracker_version }}
        FIRECRACKER_SHA256=${{ needs.runtime-pin.outputs.firecracker_sha256 }}

  setec-disk-builder:
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5
    permissions:
      # the reusable build never writes repo contents (.github#323)
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    with:
      component_name: setec-disk-builder
      component_path: .
      dockerfile_path: Dockerfile.disk-builder
      image_name: ghcr.io/zeroroot-ai/setec-disk-builder
      tag_pattern: (v.*)
      # GOTOOLCHAIN=local as a build-arg (.github#22): the build fails when
      # go.mod names a Go the pinned base does not carry.
      go_toolchain_local: true
      platforms: linux/amd64
      version_tag: ${{ inputs.version_tag || '' }}
