# Caller workflow for the two org tree guards. Copy to
# .github/workflows/tree-guards.yml in any repository.
#
#   brand-guard  fails on a retired brand string anywhere in the tracked tree
#   link-check   fails on a broken link in any Markdown file
#
# Both reusables live in zeroroot-ai/.github. Neither needs a secret: the
# checkout uses the calling repository's own GITHUB_TOKEN, and the scanners
# travel with the composite actions.
#
# The merge_group trigger is not optional on a repository with a merge queue. A
# required status check that never runs on merge_group stalls the queue until
# it times out, and every check in rulesets/repo/<repo>.json is required in
# both lanes.
#
# Per-repo exemptions:
#   .brand-guard-allow  repo-relative paths under a `# why:` comment
#   .lychee.toml        adds to the org link policy, never replaces it

name: tree-guards

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tree-guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    uses: zeroroot-ai/.github/.github/workflows/brand-guard.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5

  link-check:
    uses: zeroroot-ai/.github/.github/workflows/link-check.yml@eaa991cb73a79080f5ce1223b2f5332c47e02c70 # v0.10.5

  # Every workflow file is a valid workflow. A reference to a step or a matrix
  # key that does not exist is not an error to GitHub: it is an empty string
  # (zeroroot-ai/.github#185).
  workflow-lint:
    uses: zeroroot-ai/.github/.github/workflows/workflow-lint.yml@b4a4e65b792669f8f736091a66896c65a51e3004 # v0.12.0

  # Each ADR citation names a live ADR of the public index docs/adr-index.md,
  # a copy of the file in zeroroot-ai/gibson (gibson#908). The action runs its
  # self-test with known wrong citations before it scans this tree.
  adr-citations:
    uses: zeroroot-ai/.github/.github/workflows/adr-citations.yml@96b8fa3f95163ce097194672a80f1317830503d4 # v0.17.5
