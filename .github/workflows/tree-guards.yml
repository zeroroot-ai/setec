# Caller workflow for the two org tree guards. Copy to
# .github/workflows/tree-guards.yml in any repository.
#
#   brand-guard  fails on a retired brand string anywhere in the tracked tree
#   link-check   fails on a broken link in any Markdown file
#
# Both reusables live in zeroroot-ai/.github. Neither needs a secret: the
# checkout uses the calling repository's own GITHUB_TOKEN, and the scanners
# travel with the composite actions.
#
# The merge_group trigger is not optional on a repository with a merge queue. A
# required status check that never runs on merge_group stalls the queue until
# it times out, and every check in rulesets/repo/<repo>.json is required in
# both lanes.
#
# Per-repo exemptions:
#   .brand-guard-allow  repo-relative paths under a `# why:` comment
#   .lychee.toml        adds to the org link policy, never replaces it

name: tree-guards

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: tree-guards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    uses: zeroroot-ai/.github/.github/workflows/brand-guard.yml@c06ea08fddecc754ac6faf06f9fc0511d13cb955 # v0.5.2

  link-check:
    uses: zeroroot-ai/.github/.github/workflows/link-check.yml@c06ea08fddecc754ac6faf06f9fc0511d13cb955 # v0.5.2

  # The installer's payload gate, proven to fail (setec#17). The gate is a
  # stage of Dockerfile.installer that asserts the pruned kata tree holds
  # exactly the binaries the kata-fc handler runs. This job builds that
  # stage twice: plain, which must pass, and with PAYLOAD_MUTATION planting
  # a junk binary, which must fail. A guard that cannot fail is the
  # recurring defect class in this org; this is the proof that this one
  # can. The kata pin comes from kata.env, as in images.yml.
  installer-payload-guard:
    name: installer payload gate can fail
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Plain gate stage builds
        run: |
          set -euo pipefail
          args="$(grep -vE '^\s*(#|$)' kata.env | sed 's/^/--build-arg /')"
          # shellcheck disable=SC2086
          docker build -f Dockerfile.installer --target payload-gate $args -t payload-gate:plain .
      - name: Mutated gate stage is refused
        run: |
          set -euo pipefail
          args="$(grep -vE '^\s*(#|$)' kata.env | sed 's/^/--build-arg /')"
          # shellcheck disable=SC2086
          if docker build -f Dockerfile.installer --target payload-gate $args --build-arg PAYLOAD_MUTATION=zz-junk-binary . ; then
            echo "::error::the payload gate cannot fail: a build with a junk binary in bin passed the inventory check"
            exit 1
          fi
          echo "the mutated build was refused: the inventory guard can fail"
