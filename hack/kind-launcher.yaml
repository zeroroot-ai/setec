# kind topology for the launcher pass of the Go e2e suites
# (.github/workflows/e2e.yml, job `launcher`, setec#197).
#
# The runner exposes /dev/kvm, as for hack/kind-kvm.yaml. Here two workers
# host machines, because one scenario drains a node and resumes its session
# on the other node. Both carry the e2e-role label, and both mount the
# runner's /dev: the KVM device plugin offers /dev/kvm and /dev/net/tun of
# each node, and the Block volumes of the session workspaces are loop
# devices of the runner, so each worker sees the same devices.
#
# The launcher Pod mounts the signed disk of its image as an image volume.
# The gate is on by default from Kubernetes 1.35. The line below keeps it on
# for an older node image.
#
# Calico replaces kindnet for the reason hack/kind-kvm.yaml gives: the
# egress scenarios need a CNI that enforces NetworkPolicy.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  ImageVolume: true
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
    labels:
      setec.zeroroot.ai/e2e-role: sandbox-host
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
  - role: worker
    labels:
      setec.zeroroot.ai/e2e-role: sandbox-host
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
