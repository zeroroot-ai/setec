# kind topology for the Go e2e suite (.github/workflows/exit-test-launcher.yml, job
# `launcher`, setec#197).
#
# The job runs on a GitHub-hosted ubuntu-latest runner, which exposes
# /dev/kvm (nested virtualization). Two workers
# host machines, because one scenario drains a node and resumes its session
# on the other node. Both carry the e2e-role label, and both mount the
# runner's /dev: the KVM device plugin offers /dev/kvm and /dev/net/tun of
# each node, and the Block volumes of the session workspaces are loop
# devices of the runner, so each worker sees the same devices.
#
# The launcher Pod mounts the signed disk of its image as an image volume.
# The gate is on by default from Kubernetes 1.35. The line below keeps it on
# for an older node image.
#
# Cilium replaces kindnet. It is the network plugin of every cluster that
# runs setec (D76): the chart renders CiliumNetworkPolicy objects for its own
# namespace, and the egress scenarios assert that a Sandbox cannot reach what
# its NetworkPolicy denies. With kindnet, a Sandbox under mode=none still
# reached 1.1.1.1:443 (setec#22). The workflow installs Cilium from the pinned
# chart, with the pod CIDRs of the nodes (ipam mode kubernetes).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  ImageVolume: true
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
    labels:
      setec.zeroroot.ai/e2e-role: sandbox-host
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
  - role: worker
    labels:
      setec.zeroroot.ai/e2e-role: sandbox-host
    extraMounts:
      - hostPath: /dev
        containerPath: /dev
