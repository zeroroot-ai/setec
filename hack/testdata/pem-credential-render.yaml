# A failing fixture of hack/verify-chart-credentials.sh (setec#175). It is a
# render of the frontend with the PEM file credential flags that the chart
# no longer has. The PEM check must refuse it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: setec-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          args:
            - --listen-addr=:50051
            - --tls-cert=/etc/setec/tls/tls.crt
            - --tls-key=/etc/setec/tls/tls.key
            - --tls-client-ca=/etc/setec/tls-ca/ca.crt
