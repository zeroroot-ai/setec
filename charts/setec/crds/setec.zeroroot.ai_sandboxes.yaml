---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sandboxes.setec.zeroroot.ai
spec:
  group: setec.zeroroot.ai
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    shortNames:
    - sbx
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.runtime.chosen
      name: Runtime
      type: string
    - jsonPath: .spec.sandboxClassName
      name: Class
      type: string
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.exitCode
      name: Exit-Code
      priority: 1
      type: integer
    - jsonPath: .spec.lifecycle.mode
      name: Lifecycle
      priority: 1
      type: string
    - jsonPath: .status.warmStart.outcome
      name: Warm-Start
      priority: 1
      type: string
    - jsonPath: .status.warmStart.reason
      name: Warm-Start-Reason
      priority: 1
      type: string
    - jsonPath: .status.warmStart.entryID
      name: Pool-Entry
      priority: 1
      type: string
    - jsonPath: .status.checkpoint.sizeBytes
      name: Checkpoint-Bytes
      priority: 1
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Sandbox is the Schema for the sandboxes API. Each Sandbox represents a
          single isolated microVM execution unit following one of two lifecycles
          (docs/design/lifecycles.md): ephemeral (the default — one run, auto-destroy, stateless)
          or session (long-lived, durable /workspace volume, explicit teardown).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the Sandbox.
            properties:
              command:
                description: |-
                  Command is the entrypoint executed inside the microVM. All arguments
                  are passed verbatim; no shell interpretation occurs.

                  Required for the ephemeral lifecycle: that one command is the whole
                  life of the Sandbox (docs/design/lifecycles.md). A session may leave it empty. The
                  operator then boots the setec keepalive, a process that reaps
                  orphans and never exits on its own, so the session outlives every
                  command sent through Exec. The keepalive never depends on a shell
                  or a sleep binary in the image.
                items:
                  type: string
                type: array
              desiredState:
                default: Running
                description: |-
                  DesiredState expresses the user's intent with respect to
                  pause/resume. Phase 3 feature; defaults to Running which
                  preserves Phase 1/2 semantics.
                enum:
                - Running
                - Paused
                - Suspended
                type: string
              env:
                description: |-
                  Env is an optional set of environment variables made available to
                  the workload. Values follow the standard Kubernetes EnvVar schema.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              image:
                description: |-
                  Image is the OCI reference the microVM will run. Pull policy follows
                  the kubelet defaults; Setec does not interpret the registry.
                minLength: 1
                type: string
              lifecycle:
                description: Lifecycle carries optional runtime constraints such as
                  a timeout.
                properties:
                  mode:
                    default: ephemeral
                    description: |-
                      Mode selects the Sandbox lifecycle (docs/design/lifecycles.md): "ephemeral"
                      (default; run-to-completion, auto-destroy, stateless) or "session"
                      (long-lived, durable /workspace PVC, explicit teardown). Mode is
                      immutable: the admission webhook rejects any update that changes
                      the effective mode of an existing Sandbox.
                    enum:
                    - ephemeral
                    - session
                    type: string
                  timeout:
                    description: |-
                      Timeout bounds the maximum wall-clock runtime of the Sandbox. Once
                      the timeout elapses the controller terminates the underlying Pod and
                      marks the Sandbox Failed with reason "Timeout". Accepts any Go-style
                      duration string recognized by metav1.Duration (e.g. "30m", "8h").
                      For session Sandboxes the timeout spans the whole session (measured
                      from the first VM start), not each individual VM incarnation.
                    type: string
                  workspace:
                    description: |-
                      Workspace configures the durable session workspace PVC. Only
                      permitted when Mode=session.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          Size is the requested capacity of the workspace PVC. Defaults to
                          10Gi when unset.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          StorageClassName names the StorageClass the workspace PVC is
                          provisioned from. When unset the cluster default StorageClass is
                          used. Encryption at rest is the StorageClass's responsibility:
                          point this at a class whose CSI driver encrypts volumes (e.g. an
                          encrypted EBS/Ceph/LUKS-backed class). Setec adds no encryption
                          layer of its own.
                        type: string
                    type: object
                type: object
              network:
                description: |-
                  Network describes the egress policy. Optional; when omitted the
                  SandboxClass default applies, and when the class states no default
                  the Sandbox resolves to NetworkMode=none.
                properties:
                  allow:
                    description: |-
                      Allow is the set of permitted egress destinations. Only meaningful
                      when Mode=egress-allow-list.
                    items:
                      description: |-
                        NetworkAllow describes a single permitted egress destination when
                        NetworkMode is egress-allow-list. An entry states its ports in exactly
                        one of two forms: Port, for one TCP port, or Ports, for a list of ports
                        and port ranges with a protocol each.
                      properties:
                        cidr:
                          description: |-
                            CIDR optionally pins this entry to an address block, replacing
                            resolution of Host for this rule.

                            An explicit pin is a statement about the destination's address
                            range that DNS cannot improve on, so it wins outright and no
                            lookup happens. Use it for a destination whose addresses are known
                            and stable, or one whose name does not resolve from inside the
                            cluster. When empty, Host is resolved instead.
                          type: string
                        host:
                          description: |-
                            Host is the DNS name or IP address permitted as an egress target.

                            Kubernetes NetworkPolicy cannot match on a DNS name, so the
                            operator resolves it and writes the answer into the rule as
                            ipBlock peers, re-resolving periodically so the rule follows the
                            name. The declared value is also kept on an annotation as the
                            human-readable record.

                            A name the operator cannot resolve is DROPPED from the policy, not
                            widened: the entry contributes no rule and the drop is recorded on
                            the setec.zeroroot.ai/unresolved-allow annotation. Set CIDR to pin
                            the destination and skip resolution entirely.
                          minLength: 1
                          type: string
                        port:
                          description: |-
                            Port is the one destination TCP port permitted for this host. Set
                            Ports instead for a port range, for more than one port, or for UDP.
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        ports:
                          description: |-
                            Ports is the list of destination ports and port ranges permitted
                            for this host, each with its protocol. A port scan of a target
                            needs this form: one range from 1 to 65535 permits every port.
                          items:
                            description: NetworkAllowPort is one port or one port
                              range of a NetworkAllow entry.
                            properties:
                              endPort:
                                description: |-
                                  EndPort is the last port of the range. When it is not set, the
                                  entry permits Port only. Port 1 with EndPort 65535 permits every
                                  port of the protocol.
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              port:
                                description: |-
                                  Port is the destination port, or the first port of the range when
                                  EndPort is set.
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              protocol:
                                default: TCP
                                description: Protocol is the transport protocol of
                                  the range. It defaults to TCP.
                                enum:
                                - TCP
                                - UDP
                                type: string
                            required:
                            - port
                            type: object
                            x-kubernetes-validations:
                            - message: endPort must not be lower than port
                              rule: '!has(self.endPort) || self.endPort >= self.port'
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - host
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of port and ports
                        rule: has(self.port) != (has(self.ports) && size(self.ports)
                          > 0)
                    type: array
                  mode:
                    default: none
                    description: Mode selects the egress posture for the Sandbox.
                    enum:
                    - external-only
                    - egress-allow-list
                    - none
                    type: string
                required:
                - mode
                type: object
              resources:
                description: Resources declares the CPU and memory budget for the
                  microVM.
                properties:
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Memory is the amount of RAM allocated to the microVM, expressed as a
                      Kubernetes resource.Quantity (e.g. "2Gi", "512Mi").
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  scratch:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Scratch is the size limit of the writable scratch volume at /tmp.
                      The Pod also gets an ephemeral-storage limit of Scratch plus 1 GiB.
                      Unset takes the class default (defaultResources.scratch), else
                      10 GiB. A Sandbox may ask for less than its class permits
                      (maxResources.scratch, else 10 GiB), never for more.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  vcpu:
                    description: VCPU is the number of virtual CPUs to assign to the
                      microVM.
                    format: int32
                    maximum: 32
                    minimum: 1
                    type: integer
                required:
                - memory
                - vcpu
                type: object
                x-kubernetes-validations:
                - message: memory must not exceed 64Gi
                  rule: quantity(string(self.memory)).compareTo(quantity('64Gi'))
                    <= 0
              review:
                description: |-
                  Review makes a review Sandbox: the one kind of Sandbox that loads a
                  kept Snapshot (setec#196). A review Sandbox must have network mode
                  none.
                type: boolean
              sandboxClassName:
                description: |-
                  SandboxClassName is the name of the cluster-scoped SandboxClass this
                  Sandbox is subject to. When empty the operator resolves the class
                  flagged default:true (if any); when set the operator enforces the
                  referenced class's constraints via the validating admission webhook.
                  Optional for Phase 1 back-compat.
                type: string
              snapshot:
                description: |-
                  Snapshot optionally requests that the operator take a snapshot
                  of the Sandbox once it reaches Running. Phase 3 feature. See
                  SandboxSnapshotSpec for field semantics.
                properties:
                  afterCreate:
                    default: Running
                    description: |-
                      AfterCreate controls what happens to the Sandbox after the
                      snapshot is successfully persisted. Defaults to Running.
                    enum:
                    - Running
                    - Paused
                    - Terminated
                    type: string
                  create:
                    description: |-
                      Create, when true, requests that the operator take a snapshot of
                      the Sandbox once it reaches Running. Snapshot creation is a
                      one-shot operation — once the Snapshot CR is Ready, further
                      reconciles of the Sandbox do not re-snapshot.
                    type: boolean
                  forkable:
                    description: |-
                      Forkable lets other Sandboxes of the same namespace start from the
                      Snapshot: the forks of setec#195. Each fork loads the state with a
                      new identity, new randomness and its own writable layer.
                    type: boolean
                  kept:
                    description: |-
                      Kept keeps the Snapshot for a later review (setec#196). A kept
                      Snapshot is sealed with the key of its tenant in the S3-compatible
                      store, opens only in a review Sandbox, and expires after 30 days
                      unless a person pins it.
                    type: boolean
                  name:
                    description: |-
                      Name is the name given to the resulting Snapshot CR. Must be a
                      valid DNS-1123 label and unique within the Sandbox's namespace.
                    type: string
                  parent:
                    description: |-
                      Parent names an earlier Ready Snapshot of this Sandbox, taken from
                      its current Pod. The new Snapshot is then a diff: it holds only the
                      memory that changed since the parent. Only a launcher Sandbox takes
                      a diff. Empty takes a full snapshot.
                    type: string
                  ttl:
                    description: |-
                      TTL is forwarded to the resulting Snapshot CR's spec.ttl. When
                      set the snapshot is auto-deleted after TTL elapses if no Sandbox
                      references it.
                    type: string
                type: object
              snapshotRef:
                description: |-
                  SnapshotRef optionally requests that the Sandbox be restored
                  from a previously-captured Snapshot rather than cold-booted.
                  When set the operator pins the Pod to the node holding the
                  snapshot state files and invokes a restore via the node-agent
                  gRPC service. Phase 3 feature.
                properties:
                  name:
                    description: |-
                      Name is the name of the Snapshot in the Sandbox's namespace.
                      Cross-namespace references are rejected by the admission
                      webhook.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - image
            - resources
            type: object
          status:
            description: status reflects the observed state of the Sandbox.
            properties:
              checkpoint:
                description: |-
                  Checkpoint records the session's latest memory checkpoint and
                  its recovery bookkeeping (setec#194, docs/design/lifecycles.md L2). Nil for
                  ephemeral Sandboxes and for sessions whose class does not
                  enable sessionCheckpoint.
                properties:
                  backend:
                    description: |-
                      Backend names the storage backend holding the checkpoint
                      (currently always "s3").
                    type: string
                  lastRecovery:
                    description: |-
                      LastRecovery reports how the most recent VM (re)start recovered
                      the session: ResumedFromCheckpoint (process continued) or
                      RestartedFromWorkspace (distinct degraded condition — process
                      restarted against the durable workspace; no data lost).
                    enum:
                    - ResumedFromCheckpoint
                    - RestartedFromWorkspace
                    type: string
                  lastRecoveryAt:
                    description: |-
                      LastRecoveryAt is when the most recent recovery happened: the time
                      of the resume or of the restart (setec#237).
                    format: date-time
                    type: string
                  lastRecoveryStateTakenAt:
                    description: |-
                      LastRecoveryStateTakenAt is the time of the state that the most
                      recent recovery resumed from: the time of its checkpoint. It is
                      empty when the session restarted from the workspace, because no
                      process state survived (setec#237).
                    format: date-time
                    type: string
                  parents:
                    description: |-
                      Parents are the storage references below Ref when Ref is a diff:
                      the full checkpoint first, then each diff. A restore loads them in
                      that order, and they go with Ref.
                    items:
                      type: string
                    type: array
                  pendingRestore:
                    description: |-
                      PendingRestore is set when the next VM start should restore
                      from Ref (the session was suspended, drained, or its VM was
                      lost while a checkpoint existed). Cleared after the restore
                      attempt — success or failure — so a restore is attempted at
                      most once per checkpoint.
                    type: boolean
                  podUID:
                    description: |-
                      PodUID is the Pod whose machine wrote the checkpoint. A diff is
                      only valid on a checkpoint of the same machine (setec#194).
                    type: string
                  recoveries:
                    description: |-
                      Recoveries counts the recoveries of the session. A caller that saw
                      a recovery tells a new one by a higher count (setec#237).
                    format: int64
                    type: integer
                  ref:
                    description: |-
                      Ref is the storage reference of the latest checkpoint. Empty
                      when no live checkpoint exists (none taken yet, or the last one
                      was consumed by a restore).
                    type: string
                  sequence:
                    description: |-
                      Sequence increments with every checkpoint taken for this
                      session; it namespaces the storage ref so a new checkpoint
                      never collides with the one it replaces.
                    format: int64
                    type: integer
                  sizeBytes:
                    description: |-
                      SizeBytes is the stored (ciphertext) size of the latest
                      checkpoint.
                    format: int64
                    type: integer
                  takenAt:
                    description: TakenAt is when the latest checkpoint completed.
                    format: date-time
                    type: string
                type: object
              exitCode:
                description: |-
                  ExitCode is the exit status of the workload container once the
                  Sandbox reaches a terminal phase. Nil while still running.
                format: int32
                type: integer
              identity:
                description: |-
                  Identity is the identity of a launcher Sandbox (setec#235): the
                  public key that verifies the identity tokens of the Sandbox, and
                  its identity generation. A verifier outside the Sandbox checks a
                  token against both.
                properties:
                  generation:
                    description: |-
                      Generation rises with each snapshot of the Sandbox. A token carries
                      the generation at its signing, and a verifier accepts only the
                      current one. So a token from before a snapshot, which a fork or a
                      restore finds in its copy of the memory, no longer verifies.
                    format: int64
                    type: integer
                  publicKey:
                    description: PublicKey is the base64 ed25519 public key of the
                      Sandbox.
                    type: string
                required:
                - generation
                - publicKey
                type: object
              lastTransitionTime:
                description: LastTransitionTime is the timestamp of the most recent
                  phase change.
                format: date-time
                type: string
              pausedAt:
                description: |-
                  PausedAt is the time the Sandbox entered a Paused phase. Used by
                  the reconciler to enforce SandboxClass.spec.maxPauseDuration and
                  by the metrics subsystem to record pause latency. Cleared when
                  the Sandbox resumes.
                format: date-time
                type: string
              phase:
                description: |-
                  Phase is the high-level lifecycle state derived from the underlying
                  Pod. Once a Sandbox enters a terminal phase (Completed or Failed)
                  the controller will not roll it back to Pending or Running.
                enum:
                - Pending
                - Running
                - Completed
                - Failed
                - Paused
                - Snapshotting
                - Restoring
                - Suspended
                type: string
              podName:
                description: |-
                  PodName is the name of the backing Pod created by the controller.
                  Defaults to "<sandbox-name>-vm".
                type: string
              reason:
                description: |-
                  Reason is a short, machine-readable explanation for the current
                  phase. Populated on Failed (e.g. "Timeout", "ImagePullFailure",
                  "RuntimeUnavailable", "ContainerExitedNonZero").
                type: string
              runtime:
                description: |-
                  Runtime records the isolation backend selected for this Sandbox.
                  Populated by the reconciler after backend selection; nil while Pending.
                properties:
                  chosen:
                    description: |-
                      Chosen is the name of the backend selected after evaluating the
                      SandboxClass's primary backend and any fallback chain. One of
                      kata-fc, kata-qemu, gvisor, or runc.
                    type: string
                type: object
              startedAt:
                description: |-
                  StartedAt is the time the underlying Pod first transitioned to
                  Running.
                format: date-time
                type: string
              warmStart:
                description: |-
                  WarmStart records the outcome of the one-shot pool warm-start
                  attempt for Sandboxes whose class maintains a pre-warm pool
                  (docs/design/lifecycles.md). Nil when no attempt was made (class has no pool,
                  image mismatch, or explicit snapshotRef). Its presence is the
                  idempotency marker: the controller attempts a warm start at
                  most once per Sandbox.
                properties:
                  entryID:
                    description: |-
                      EntryID identifies the consumed pool entry when Outcome is
                      PoolRestored.
                    type: string
                  outcome:
                    description: |-
                      Outcome is PoolRestored when the Sandbox started from a pool
                      entry, ColdBoot otherwise.
                    enum:
                    - PoolRestored
                    - ColdBoot
