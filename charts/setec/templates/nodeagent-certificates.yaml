{{- if and .Values.snapshots.enabled .Values.snapshots.mTLS.certManager.enabled }}
{{- /*
Operator<->node-agent mTLS material, issued by cert-manager (setec#14).

Three Secrets come out of this file, from one trust root:

  caSecret            a self-signed CA, issued by the bootstrap issuer in
                      snapshots.mTLS.certManager.issuerRef
  nodeAgentCertSecret the node-agent server leaf, issued by the CA Issuer
  operatorCertSecret  the operator client leaf, issued by the CA Issuer

The two leaves must chain to ONE root. Issuing each leaf straight from a
selfsigned issuer makes each leaf its own root, so the operator and the
node-agent never verify each other even when every Secret exists. The
namespaced Issuer below is what gives them the shared root.

The CA Secret holds the CA private key as tls.key. The workloads mount
only its ca.crt item (deployment.yaml, daemonset.yaml), so the key never
reaches a Pod.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "setec.fullname" . }}-nodeagent-ca
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  isCA: true
  secretName: {{ .Values.snapshots.mTLS.caSecret }}
  commonName: {{ include "setec.fullname" . }}-nodeagent-ca
  duration: 43800h # 5 years
  renewBefore: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    {{- toYaml .Values.snapshots.mTLS.certManager.issuerRef | nindent 4 }}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "setec.fullname" . }}-nodeagent-ca
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.snapshots.mTLS.caSecret }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "setec.fullname" . }}-nodeagent-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.snapshots.mTLS.nodeAgentCertSecret }}
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  commonName: {{ include "setec.fullname" . }}-node-agent.{{ .Values.namespace }}.svc
  dnsNames:
    - {{ include "setec.fullname" . }}-node-agent.{{ .Values.namespace }}.svc
    - {{ include "setec.fullname" . }}-node-agent.{{ .Values.namespace }}.svc.cluster.local
    - "*.{{ include "setec.fullname" . }}-node-agent.{{ .Values.namespace }}.svc"
    - "*.{{ include "setec.fullname" . }}-node-agent.{{ .Values.namespace }}.svc.cluster.local"
  issuerRef:
    kind: Issuer
    name: {{ include "setec.fullname" . }}-nodeagent-ca
  usages:
    - server auth
    - client auth
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "setec.fullname" . }}-operator-client
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.snapshots.mTLS.operatorCertSecret }}
  duration: 8760h
  renewBefore: 720h
  commonName: setec-operator
  issuerRef:
    kind: Issuer
    name: {{ include "setec.fullname" . }}-nodeagent-ca
  usages:
    - client auth
{{- end }}
