{{/*
Render-time validation for the operator<->node-agent mTLS channel (setec#14).

snapshots.enabled=true in file mode makes BOTH the operator Deployment and the
node-agent DaemonSet mount two Secrets, neither marked optional:

  - snapshots.mTLS.operatorCertSecret  (setec-nodeagent-client-tls)
  - snapshots.mTLS.caSecret            (setec-nodeagent-ca)

A missing non-optional Secret does not fail the install cleanly. It wedges the
pod, so `helm install --wait` dies minutes later with

    Deployment/... not ready. status: InProgress, Available: 0/2
    context deadline exceeded

which names neither the Secret nor the cause.

With snapshots.mTLS.certManager.enabled=true the chart issues all three
Secrets from one CA (nodeagent-certificates.yaml), so nothing is missing.
With it false the operator supplies all three out of band and confirms the
CA with snapshots.mTLS.caProvided=true. The two are exclusive: a caProvided
that cert-manager mode would ignore is refused rather than silently dropped.
*/}}
{{- if and .Values.snapshots.enabled (ne .Values.credentials.mode "spiffe") }}
  {{- $ca := .Values.snapshots.mTLS.caSecret }}
  {{- if not $ca }}
    {{- fail "snapshots.enabled=true in file mode mounts snapshots.mTLS.caSecret into the operator and the node-agent, but it is empty. Set it to the Secret holding the CA that signs both sides of the node-agent mTLS channel." }}
  {{- end }}
  {{- if not .Values.snapshots.mTLS.operatorCertSecret }}
    {{- fail "snapshots.enabled=true in file mode mounts snapshots.mTLS.operatorCertSecret into the operator, but it is empty. Set it to the Secret holding the operator's client certificate." }}
  {{- end }}
  {{- if not .Values.snapshots.mTLS.nodeAgentCertSecret }}
    {{- fail "snapshots.enabled=true in file mode mounts snapshots.mTLS.nodeAgentCertSecret into the node-agent, but it is empty. Set it to the Secret holding the node-agent's server certificate." }}
  {{- end }}
  {{- if .Values.snapshots.mTLS.certManager.enabled }}
    {{- if .Values.snapshots.mTLS.caProvided }}
      {{- fail (printf "snapshots.mTLS.caProvided=true and snapshots.mTLS.certManager.enabled=true are exclusive. cert-manager mode issues %q itself from the CA Certificate in nodeagent-certificates.yaml, so an out-of-band CA would be overwritten. Choose one: let cert-manager issue the CA (drop caProvided), or supply all three Secrets out of band (certManager.enabled=false, caProvided=true)." $ca) }}
    {{- end }}
  {{- else if not .Values.snapshots.mTLS.caProvided }}
    {{- fail (printf "snapshots.enabled=true in file mode mounts the Secret %q (snapshots.mTLS.caSecret) into BOTH the operator and the node-agent, and with snapshots.mTLS.certManager.enabled=false this chart does not create it. A non-optional missing Secret wedges the pods, so `helm install --wait` fails minutes later with an opaque 'context deadline exceeded' instead of telling you this.\n\nEither let cert-manager issue the channel:\n  snapshots.mTLS.certManager.enabled=true (a CA Certificate, a CA Issuer and both leaves, from one root)\n\nOr provide the CA, then confirm it:\n  1. Create %q in namespace %q holding, as ca.crt, the CA that signs BOTH the node-agent server cert and the operator client cert.\n  2. Set snapshots.mTLS.caProvided=true to acknowledge it exists.\n\nOr disable the channel: snapshots.enabled=false." $ca $ca .Values.namespace) }}
  {{- end }}
{{- end }}
