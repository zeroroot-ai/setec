{{- with .Values.launcher }}
{{- /*
The operator runs setec-disk-builder as one Job in its own namespace for each
image digest (docs/design/runtime.md): a check, a build and a publish
container. It needs get and create on Jobs and on the signature ConfigMaps
there, and nowhere else. The Job Pods have no ServiceAccount token. The
operator reads the build report from the termination message of the build
container, through its cluster-wide Pod read.

The operator also reads the signing Secret, and only that Secret: the key id
of its seed names the tag of each disk, so a rotated seed builds a new disk
(setec#272), and the operator signs each disk with it. The operator is the
only reader of the seed: no Job mounts it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "setec.fullname" $ }}-disk-builder
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, create]
  # The signature ConfigMap of each disk Job: the operator writes it after
  # the build container reports, and the publish container mounts it. The
  # Job owns it. create cannot be limited by name.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .diskBuilder.signingSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "setec.fullname" $ }}-disk-builder
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "setec.fullname" $ }}-disk-builder
subjects:
  - kind: ServiceAccount
    name: {{ include "setec.serviceAccountName" $ }}
    namespace: {{ $.Values.namespace }}
{{- end }}
