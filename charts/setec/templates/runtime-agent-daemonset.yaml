apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "setec.fullname" . }}-runtime-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime-agent
spec:
  selector:
    matchLabels:
      {{- include "setec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime-agent
  template:
    metadata:
      labels:
        {{- include "setec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime-agent
    spec:
      serviceAccountName: {{ include "setec.fullname" . }}-runtime-agent
      hostPID: false
      hostNetwork: false
      hostIPC: false
      # Pod-level identity. The image is distroless-nonroot and already
      # carries USER 65532:65532, so this changes no runtime behaviour —
      # what it changes is who checks. runAsNonRoot: true makes the kubelet
      # refuse to start the Pod if a future image (a rebuild on a different
      # base, a mirror substitution) ships a root entrypoint, instead of
      # quietly running the agent as root against the API server
      # (GHSA-p8f8-3qpw-7h93).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # tolerations default to matching every taint: the runtime-agent
      # needs to run on every node the operator might schedule a Sandbox
      # onto, and a node it never probed looks uncapable. Values-driven so
      # a cluster that keeps Sandboxes off, say, control-plane or
      # infrastructure nodes can stop placing the agent there too — the
      # capability view only has to cover nodes that can actually host a
      # Sandbox.
      tolerations:
        {{- toYaml .Values.runtimeAgent.tolerations | nindent 8 }}
      {{- /* Published runtime-agent images are amd64-only (setec#132), so an
      unconstrained DaemonSet ImagePullBackOffs forever on arm64 (Graviton
      system) nodes and the release never converges. Values-driven so
      mixed-arch clusters can pin {kubernetes.io/arch: amd64}; empty keeps
      the run-everywhere default. */}}
      {{- with .Values.runtimeAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: runtime-agent
          image: "{{ .Values.runtimeAgent.image.repository }}:{{ .Values.runtimeAgent.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.runtimeAgent.image.pullPolicy }}
          args:
            - --runtimes-config=/etc/setec/runtimes.yaml
            - --node-name=$(NODE_NAME)
            - --metrics-addr=:{{ .Values.runtimeAgent.metricsPort }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.runtimeAgent.metricsPort }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.runtimeAgent.resources | nindent 12 }}
          securityContext:
            # Host mounts are read-only but we still drop every capability
            # we don't need. The probes do not require elevated privileges:
            # every one of them is an os.Stat against a read-only mount
            # (see internal/runtimeagent/probe/detector_linux.go), and no
            # probe opens /dev/kvm or executes a subprocess.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: runtimes-config
              mountPath: /etc/setec/runtimes.yaml
              subPath: runtimes.yaml
              readOnly: true
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: host-sys-module
              mountPath: /host/sys/module
              readOnly: true
            - name: host-usr-bin
              mountPath: /host/usr/bin
              readOnly: true
            - name: host-usr-local-bin
              mountPath: /host/usr/local/bin
              readOnly: true
            {{- if .Values.runtimeAgent.mountContainerdConfig }}
            - name: host-etc-containerd
              mountPath: /host/etc/containerd
              readOnly: true
            {{- end }}
      volumes:
        - name: runtimes-config
          configMap:
            name: {{ include "setec.fullname" . }}-runtimes
            items:
              - key: runtimes.yaml
                path: runtimes.yaml
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-sys-module
          hostPath:
            path: /sys/module
        - name: host-usr-bin
          hostPath:
            path: /usr/bin
        - name: host-usr-local-bin
          hostPath:
            path: /usr/local/bin
            type: DirectoryOrCreate
        {{- if .Values.runtimeAgent.mountContainerdConfig }}
        - name: host-etc-containerd
          hostPath:
            path: /etc/containerd
            type: DirectoryOrCreate
        {{- end }}
      terminationGracePeriodSeconds: 10
