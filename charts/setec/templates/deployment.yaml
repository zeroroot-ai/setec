apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "setec.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  # The selector names the component, so it matches no Pod of the device
  # plugin, the frontend or the node agent. Each of them carries the same
  # name and instance labels and its own component label. Setec 0.130 and
  # older had no component in the selector. An upgrade from them needs the
  # one-time step of the README ("Upgrading from 0.130"), because a
  # Deployment selector is immutable. The check
  # "setec.validateOperatorSelector" tells an install to run it.
  selector:
    matchLabels:
      {{- include "setec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "setec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ include "setec.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --metrics-bind-address=:{{ .Values.metricsPort }}
            - --health-probe-bind-address=:{{ .Values.healthPort }}
            - --leader-elect={{ .Values.leaderElect }}
            {{- if .Values.multiTenancy.enabled }}
            - --multi-tenancy-enabled
            - --tenant-label-key={{ .Values.multiTenancy.tenantLabelKey }}
            {{- end }}
            {{- if and .Values.observability.enabled .Values.observability.otlpEndpoint }}
            - --otlp-endpoint={{ .Values.observability.otlpEndpoint }}
            {{- if not .Values.observability.otelTLS.enabled }}
            - --otel-insecure
            {{- else if .Values.observability.otelTLS.caSecretName }}
            - --otel-ca-file=/etc/setec/otel-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --webhook-enabled
            {{- end }}
            {{- if not .Values.netpol.reservedCIDRs }}
            {{- fail "netpol.reservedCIDRs must not be empty: an empty reserved list gives every Sandbox unrestricted egress. Narrow it for self-hosted installs, do not clear it." }}
            {{- end }}
            {{- /* A reserved prefix only subtracts from an egress block of its
                   own address family. An allow-list entry can name a literal
                   IPv6 host or an IPv6 CIDR, so a list with one family missing
                   leaves every block of the other family unrestricted. The
                   operator refuses the same list at startup. */}}
            {{- $reserved := join "," .Values.netpol.reservedCIDRs }}
            {{- if not (regexMatch "(^|,)[0-9]+\\." $reserved) }}
            {{- fail "netpol.reservedCIDRs must hold at least one IPv4 prefix: nothing else subtracts from an IPv4 egress block." }}
            {{- end }}
            {{- if not (regexMatch "(^|,)[0-9a-fA-F:]*:" $reserved) }}
            {{- fail "netpol.reservedCIDRs must hold at least one IPv6 prefix (for example fc00::/7): nothing else subtracts from an IPv6 egress block." }}
            {{- end }}
            {{- if not .Values.netpol.resolvers }}
            {{- fail "netpol.resolvers must not be empty: Sandboxes resolve names through these addresses instead of cluster DNS." }}
            {{- end }}
            - --reserved-cidrs={{ join "," .Values.netpol.reservedCIDRs }}
            - --sandbox-resolvers={{ join "," .Values.netpol.resolvers }}
            {{- with .Values.launcher }}
            {{- if not .diskRepo }}
            {{- fail "launcher.diskRepo is required: each launcher machine boots the signed disk of its image from there" }}
            {{- end }}
            {{- if not .diskBuilder.publicKeys }}
            {{- fail "launcher.diskBuilder.publicKeys is required: each launcher checks the disk signature with them" }}
            {{- end }}
            {{- if not .diskBuilder.signingSecret }}
            {{- fail "launcher.diskBuilder.signingSecret is required: it signs each image disk" }}
            {{- end }}
            - --launcher-image={{ .image.repository }}:{{ .image.tag | default $.Chart.AppVersion }}
            - --disk-repo={{ .diskRepo }}
            - --disk-builder-image={{ .diskBuilder.image.repository }}:{{ .diskBuilder.image.tag | default $.Chart.AppVersion }}
            - --disk-signing-secret={{ .diskBuilder.signingSecret }}
            {{- with .diskBuilder.registrySecret }}
            - --disk-registry-secret={{ . }}
            {{- end }}
            {{- range $.Values.imagePullSecrets }}
            - --image-pull-secret={{ .name }}
            {{- end }}
            {{- with .diskBuilder.pull.secret }}
            - --disk-pull-secret={{ . }}
            {{- end }}
            {{- range .diskBuilder.pull.providers }}
            - --disk-pull-provider={{ . }}
            {{- end }}
            {{- with .diskBuilder.pull.aws.roleArn }}
            - --disk-pull-aws-role-arn={{ . }}
            {{- end }}
            {{- range .diskBuilder.push.providers }}
            - --disk-push-provider={{ . }}
            {{- end }}
            {{- with .diskBuilder.push.aws.roleArn }}
            - --disk-push-aws-role-arn={{ . }}
            - --disk-push-aws-audience={{ $.Values.launcher.diskBuilder.push.aws.audience }}
            {{- end }}
            - --instance-name={{ $.Release.Name }}
            {{- $placement := dict }}
            {{- with .diskBuilder.nodeSelector }}{{ $_ := set $placement "nodeSelector" . }}{{ end }}
            {{- with .diskBuilder.tolerations }}{{ $_ := set $placement "tolerations" . }}{{ end }}
            {{- with .diskBuilder.affinity }}{{ $_ := set $placement "affinity" . }}{{ end }}
            {{- with .diskBuilder.priorityClassName }}{{ $_ := set $placement "priorityClassName" . }}{{ end }}
            {{- if $placement }}
            - {{ printf "--disk-job-placement=%s" (toJson $placement) | quote }}
            {{- end }}
            {{- with (include "setec.diskBuilderServiceAccountName" $) }}
            - --disk-service-account={{ . }}
            {{- end }}
            - --operator-namespace={{ $.Values.namespace }}
            {{- range .imageSources }}
            - --image-registry={{ .registry }}
            {{- end }}
            {{- with .warmPool.namespace }}
            {{- if not (has . $.Values.sandboxNamespaces) }}
            {{- fail (printf "launcher.warmPool.namespace %q must be one of sandboxNamespaces: the operator writes the base Pods there, and the namespace baseline deny policy confines them" .) }}
            {{- end }}
            - --warm-pool-namespace={{ . }}
            {{- end }}
            {{- range .diskBuilder.publicKeys }}
            - --disk-public-key={{ . }}
            {{- end }}
            {{- end }}
            {{- if .Values.snapshots.enabled }}
            - --snapshots-enabled
            - --kept-pinned-limit={{ .Values.snapshots.kept.pinnedLimit }}
            - --nodeagent-authority-pattern=%s.{{ include "setec.fullname" . }}-node-agent.{{ .Values.namespace }}.svc:50052
            - --nodeagent-namespace={{ .Values.namespace }}
            - --nodeagent-spiffe-socket={{ .Values.credentials.spiffe.socketPath }}
            {{- range .Values.credentials.spiffe.authorizedIDs.nodeAgentServers }}
            - --nodeagent-spiffe-authorized-id={{ . }}
            {{- end }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metricsPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- if .Values.snapshots.enabled }}
            - name: spiffe-workload-api
              mountPath: {{ dir .Values.credentials.spiffe.socketPath }}
              readOnly: true
            {{- end }}
            {{- if and .Values.observability.enabled .Values.observability.otelTLS.enabled .Values.observability.otelTLS.caSecretName }}
            - name: otel-ca
              mountPath: /etc/setec/otel-ca
              readOnly: true
            {{- end }}
            {{- if .Values.webhook.enabled }}
            # controller-runtime's webhook server reads tls.crt/tls.key from
            # this dir (it does not self-generate). Without it --webhook-enabled
            # fails closed and rejects every Sandbox. cert-manager (or the e2e
            # harness) provisions the Secret; see webhook.certSecret.
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.snapshots.enabled }}
        - name: spiffe-workload-api
          hostPath:
            path: {{ dir .Values.credentials.spiffe.socketPath }}
            type: Directory
        {{- end }}
        {{- if and .Values.observability.enabled .Values.observability.otelTLS.enabled .Values.observability.otelTLS.caSecretName }}
        - name: otel-ca
          secret:
            secretName: {{ .Values.observability.otelTLS.caSecretName }}
        {{- end }}
        {{- if .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ .Values.webhook.certSecret | default (printf "%s-webhook-cert" (include "setec.fullname" .)) }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
