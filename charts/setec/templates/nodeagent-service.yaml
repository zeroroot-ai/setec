{{- if and .Values.nodeAgent.enabled .Values.snapshots.enabled }}
# Headless Service selecting the node-agent DaemonSet pods.
#
# The operator does NOT dial through this Service (setec#92): a
# per-pod DNS record such as <node>.<service>.<namespace>.svc only
# exists when a Pod sets hostname and subdomain, and the node-agent
# DaemonSet sets neither, so that name has never resolved. The
# operator instead finds the right Pod through the API (by node name
# and the app.kubernetes.io/component=node-agent label) and dials its
# Pod IP directly.
#
# This Service still matters for one thing: the node-agent
# Certificate (nodeagent-certificates.yaml) carries this Service's
# bare and wildcard names as SANs, and the operator sends the same
# per-node name pattern as the gRPC :authority so TLS verification
# checks the certificate against a SAN it actually carries, even
# though the name is never looked up in DNS.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "setec.fullname" . }}-node-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
spec:
  # ClusterIP: None makes this headless. Nothing dials through it.
  # It exists to back the SANs on the node-agent Certificate above.
  clusterIP: None
  selector:
    {{- include "setec.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: node-agent
  ports:
    - name: grpc
      port: 50052
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
{{- end }}
