{{- /*
The network policy of the setec namespace (values.yaml systemPolicy). Cilium
enforces it.

  1. default deny  One CiliumClusterwideNetworkPolicy selects each Pod of the
                   namespace. It allows DNS and nothing else. DNS goes to
                   systemPolicy.dns: the CoreDNS or kube-dns Pods of
                   kube-system by default.
  2. operator      the API server out, the collector of traces out when
                   observability.otlpEndpoint is set (the host name, the
                   address, or the Pods of systemPolicy.otlp), the webhook
                   port from the API server,
                   the nodes and systemPolicy.webhookCallers, the node agent
                   gRPC out when snapshots are on, and its metrics port from
                   the scrapers.
  3. frontend      its gRPC port from systemPolicy.frontendCallers only, the
                   API server out (Sandbox CRs, exec through the API server),
                   and its metrics port from the scrapers.
  4. node-agent    its gRPC port from the operator when snapshots are on, the
                   snapshot store out, and its metrics port from the scrapers.
  5. disk jobs     the Jobs of the operator, each by its component label.
                   No Job reaches the world (no toEntities world):
                   - disk-builder: the hosts of launcher.imageSources, the
                     address and port of each source at an IP address, and
                     the disk registry. Its build container, which reads
                     the image, holds no secret; its check and publish
                     containers hold the push credential and read no image.
                   - image-verify: the same sources and
                     systemPolicy.sigstoreHosts.
                   Both Jobs also reach systemPolicy.credentialEndpoints.
                   The operator holds the seed and signs between the build
                   and the publish container; it has no registry egress.

The device plugin gets no allow: it talks to the kubelet over a unix socket.

This file renders when systemPolicy.engine is "cilium", the default. The
engine "networkpolicy" renders plain NetworkPolicy objects instead, from
templates/system-namespace-networkpolicy.yaml. The chart refuses to render
this file when the cluster has no Cilium CRDs (setec.validateSystemPolicy).
development/k3s installs Cilium. docs/design/network-policy.md says what each
engine enforces. hack/verify-chart-security.sh renders both files and fails
when a Pod of the namespace has no allow it needs, or when the default deny is
missing.
*/}}
{{- define "setec.dnsPorts" -}}
- ports:
    - port: "53"
      protocol: UDP
    - port: "53"
      protocol: TCP
  rules:
    dns:
      - matchPattern: "*"
{{- end }}
{{- /*
setec.endpointEgress renders an egress rule to one endpoint: the collector of
the traces of the operator, or the S3 store of the node agent. Call it with
(dict "target" <setec.endpointParts> "peer" <the namespace and podLabels of
the endpoint, from systemPolicy.otlp or systemPolicy.snapshotStore>). An
endpoint in this cluster is a Pod peer. An address is a CIDR. Any other name is
a host name. A Service name of the cluster cannot be matched by host name, and
the render stops for it (setec.validateOtlp, setec.validateSnapshotStore).
*/ -}}
{{- define "setec.endpointEgress" -}}
{{- $t := .target }}
{{- $peer := .peer | default dict }}
{{- if and $peer.namespace $peer.podLabels }}
{{- $labels := dict "k8s:io.kubernetes.pod.namespace" $peer.namespace }}
{{- range $k, $v := $peer.podLabels }}
{{- $labels = set $labels (ternary $k (printf "k8s:%s" $k) (contains ":" $k)) $v }}
{{- end }}
- toEndpoints:
    - matchLabels:
        {{- toYaml $labels | nindent 8 }}
{{- else if $t.isIP }}
- toCIDR:
    - {{ $t.cidr | quote }}
{{- else }}
- toFQDNs:
    - matchName: {{ $t.host | quote }}
{{- end }}
  toPorts:
    - ports:
        - port: {{ $t.port | quote }}
          protocol: TCP
{{- end }}
{{- define "setec.diskRegistryEgress" -}}
{{- if .isIP }}
- toCIDR:
    - {{ printf "%s/32" .host }}
{{- else }}
- toFQDNs:
    - matchName: {{ .host | quote }}
{{- end }}
  toPorts:
    - ports:
        - port: {{ .port | quote }}
          protocol: TCP
{{- end }}
{{- define "setec.imageSourceEgress" -}}
{{- $hosts := list }}
{{- range $src := .sources }}
{{- $hosts = concat $hosts ($src.hosts | default list) }}
{{- end }}
{{- if $hosts }}
- toFQDNs:
    {{- range $h := $hosts }}
    {{- if hasPrefix "*." $h }}
    - matchPattern: {{ $h | quote }}
    {{- else }}
    - matchName: {{ $h | quote }}
    {{- end }}
    {{- end }}
  toPorts:
    - ports:
        - port: "443"
          protocol: TCP
{{- end }}
{{- range $e := .endpoints }}
- toCIDR:
    - {{ $e.cidr | quote }}
  toPorts:
    - ports:
        {{- range $e.ports }}
        - port: {{ . | quote }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- /* A source at an IPv4 address serves its own blobs, so its address and
port are the whole allow. The disk registry has its own rule, so it is not
repeated here. */}}
{{- range $src := .sources }}
{{- $addr := include "setec.registryAddress" $src.registry | fromJson }}
{{- if and $addr.isIP (ne $src.registry $.diskRegistry) }}
- toCIDR:
    - {{ printf "%s/32" $addr.host }}
  toPorts:
    - ports:
        - port: {{ $addr.port | quote }}
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
{{- define "setec.metricsScraperPeers" -}}
{{- range $c := .metricsScrapers }}
- matchLabels:
    k8s:io.kubernetes.pod.namespace: {{ $c.namespace | quote }}
    {{- toYaml (omit $c.podLabels "k8s:io.kubernetes.pod.namespace") | nindent 4 }}
{{- end }}
{{- end }}
{{- if eq (include "setec.systemPolicyEngine" .) "cilium" }}
{{- $ns := .Values.namespace }}
{{- $fn := include "setec.fullname" . }}
{{- $sp := .Values.systemPolicy }}
{{- $dns := include "setec.systemDNS" . | fromJson }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ $fn }}-{{ $ns }}-default-deny
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "Each Pod of the namespace {{ $ns }} denies all traffic, except DNS."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $ns }}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    {{- if $dns.podLabels }}
    {{- /* Cilium names the source of a label. A label with no source is a Kubernetes label. */}}
    {{- $peer := dict "k8s:io.kubernetes.pod.namespace" $dns.namespace }}
    {{- range $k, $v := $dns.podLabels }}
    {{- $peer = set $peer (ternary $k (printf "k8s:%s" $k) (contains ":" $k)) $v }}
    {{- end }}
    - toEndpoints:
        - matchLabels:
            {{- toYaml $peer | nindent 12 }}
      toPorts:
        {{- include "setec.dnsPorts" . | nindent 8 }}
    {{- end }}
    {{- if $dns.cidrs }}
    - toCIDR:
        {{- toYaml $dns.cidrs | nindent 8 }}
      toPorts:
        {{- include "setec.dnsPorts" . | nindent 8 }}
    {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-operator
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "The operator reaches the API server and the node agents, and takes webhook calls and scrapes."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "setec.name" . }}
      app.kubernetes.io/component: operator
  egress:
    - toEntities:
        - kube-apiserver
    {{- if .Values.snapshots.enabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "setec.name" . }}
            app.kubernetes.io/component: node-agent
      toPorts:
        - ports:
            - port: "50052"
              protocol: TCP
    {{- end }}
    {{- $otlp := include "setec.otlpTarget" . | default "{}" | fromJson }}
    {{- if $otlp.host }}
    {{- include "setec.endpointEgress" (dict "target" $otlp "peer" $sp.otlp) | nindent 4 }}
    {{- end }}
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    {{- with $sp.webhookCallers }}
    - fromEndpoints:
        {{- range $c := . }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $c.namespace | quote }}
            {{- toYaml (omit $c.podLabels "k8s:io.kubernetes.pod.namespace") | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    {{- end }}
    - fromEndpoints:
        {{- include "setec.metricsScraperPeers" $sp | trim | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ .Values.metricsPort | quote }}
              protocol: TCP
{{- if .Values.frontend.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "The frontend takes gRPC from its callers only and reaches the API server."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "setec.name" . }}
      app.kubernetes.io/component: frontend
  egress:
    - toEntities:
        - kube-apiserver
  {{- $grpcPort := regexReplaceAll "^.*:" (toString .Values.frontend.listenAddr) "" }}
  {{- $pods := list }}
  {{- $cidrs := list }}
  {{- range $c := $sp.frontendCallers }}
  {{- if $c.cidr }}
  {{- $cidrs = append $cidrs $c.cidr }}
  {{- else }}
  {{- $pods = append $pods $c }}
  {{- end }}
  {{- end }}
  ingress:
    {{- if $pods }}
    - fromEndpoints:
        {{- range $c := $pods }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ required "each systemPolicy.frontendCallers entry needs a namespace or a cidr" $c.namespace }}
            {{- toYaml (required "each systemPolicy.frontendCallers entry with a namespace needs podLabels" $c.podLabels) | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $grpcPort | quote }}
              protocol: TCP
    {{- end }}
    {{- if $cidrs }}
    - fromCIDR:
        {{- range $cidrs }}
        - {{ . }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $grpcPort | quote }}
              protocol: TCP
    {{- end }}
    - fromEndpoints:
        {{- include "setec.metricsScraperPeers" $sp | trim | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ .Values.frontend.metricsPort | quote }}
              protocol: TCP
{{- end }}
{{- if .Values.nodeAgent.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-node-agent
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "The node agent takes gRPC from the operator and scrapes, and reaches the snapshot store."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "setec.name" . }}
      app.kubernetes.io/component: node-agent
  ingress:
    {{- if .Values.snapshots.enabled }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "setec.name" . }}
            app.kubernetes.io/component: operator
      toPorts:
        - ports:
            - port: "50052"
              protocol: TCP
    {{- end }}
    - fromEndpoints:
        {{- include "setec.metricsScraperPeers" $sp | trim | nindent 8 }}
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  {{- if .Values.snapshots.enabled }}
  {{- $s3 := .Values.snapshots.s3 }}
  egress:
    {{- $store := include "setec.snapshotStoreTarget" . | default "{}" | fromJson }}
    {{- if $store.host }}
    {{- /* The store: the Pods of systemPolicy.snapshotStore, or the address of
    an IP endpoint, or the host name. */}}
    {{- include "setec.endpointEgress" (dict "target" $store "peer" $sp.snapshotStore) | nindent 4 }}
    {{- else }}
    - toFQDNs:
        - matchName: {{ printf "s3.%s.amazonaws.com" $s3.region | quote }}
        - matchName: {{ printf "%s.s3.%s.amazonaws.com" $s3.bucket $s3.region | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
  {{- end }}
{{- end }}
{{- with .Values.launcher.diskRepo }}
{{- $registry := first (splitList "/" .) }}
{{- $parts := splitList ":" $registry }}
{{- $host := first $parts }}
{{- $port := ternary (last $parts) "443" (gt (len $parts) 1) }}
{{- $isIP := regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $host }}
{{- $sources := $.Values.launcher.imageSources }}
{{- if not $sources }}
{{- fail "launcher.imageSources must not be empty: the disk builder pulls each launcher image from one of these registries, and reaches no other host" }}
{{- end }}
{{- range $src := $sources }}
{{- if not $src.registry }}
{{- fail "each launcher.imageSources entry needs a registry" }}
{{- end }}
{{- $addr := include "setec.registryAddress" $src.registry | fromJson }}
{{- if and (not $src.hosts) (not $addr.isIP) }}
{{- fail (printf "launcher.imageSources entry %q needs its hosts (the registry host and the hosts that serve its blobs, which a registry such as ECR sends a download to). Only a registry at an IP address may list none: the disk Jobs reach that address and port, and it sends no download elsewhere" $src.registry) }}
{{- end }}
{{- end }}
{{- $disk := dict "isIP" $isIP "host" $host "port" $port }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-disk-builder
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
spec:
  description: "The disk Job reaches the named image registries and the disk registry. No container of it holds the signing seed."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: disk-builder
  egress:
    {{- include "setec.imageSourceEgress" (dict "sources" $sources "diskRegistry" $registry "endpoints" $sp.credentialEndpoints) | nindent 4 }}
    {{- include "setec.diskRegistryEgress" $disk | nindent 4 }}
    {{- $pushHosts := include "setec.pushHosts" $ | fromJsonArray }}
    {{- if $pushHosts }}
    - toFQDNs:
        {{- range $pushHosts }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-image-verify
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
spec:
  description: "The image verify Job reaches the named image registries and the Sigstore trust root."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: image-verify
  egress:
    {{- include "setec.imageSourceEgress" (dict "sources" $sources "diskRegistry" $registry "endpoints" $sp.credentialEndpoints) | nindent 4 }}
    {{- range $src := $sources }}
    {{- if eq $src.registry $registry }}
    {{- include "setec.diskRegistryEgress" $disk | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- with $sp.sigstoreHosts }}
    - toFQDNs:
        {{- range . }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
{{- end }}
{{- end }}
