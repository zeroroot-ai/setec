{{- /*
The network policy of the setec namespace (values.yaml systemPolicy). Cilium
enforces it.

  1. default deny  One CiliumClusterwideNetworkPolicy selects each Pod of the
                   namespace. It allows DNS to kube-dns and nothing else, in
                   both directions.
  2. operator      the API server out, the webhook port from the API server,
                   the nodes and systemPolicy.webhookCallers, the node agent
                   gRPC out when snapshots are on, and its metrics port from
                   the scrapers.
  3. frontend      its gRPC port from systemPolicy.frontendCallers only, the
                   API server out (Sandbox CRs, exec through the API server),
                   and its metrics port from the scrapers.
  4. node-agent    its gRPC port from the operator when snapshots are on, the
                   snapshot store out, and its metrics port from the scrapers.
  5. disk jobs     the Jobs of the operator, each by its component label.
                   No Job reaches the world (no toEntities world):
                   - disk-builder: the hosts of launcher.imageSources and
                     the disk registry. It holds no signing seed.
                   - disk-publisher: the disk registry only. It holds no
                     signing seed.
                   - image-verify: the hosts of launcher.imageSources and
                     systemPolicy.sigstoreHosts.
                   The operator holds the seed and signs between the build
                   and the publish Job; it has no registry egress.

The device plugin gets no allow: it talks to the kubelet over a unix socket.

The policy always renders. Cilium is the network plugin of every cluster that
runs setec (D76); development/k3s installs it too.
hack/verify-chart-security.sh renders this file and fails when a Pod of the
namespace has no allow it needs, or when the default deny is missing.
*/}}
{{- define "setec.diskRegistryEgress" -}}
{{- if .isIP }}
- toCIDR:
    - {{ printf "%s/32" .host }}
{{- else }}
- toFQDNs:
    - matchName: {{ .host | quote }}
{{- end }}
  toPorts:
    - ports:
        - port: {{ .port | quote }}
          protocol: TCP
{{- end }}
{{- define "setec.imageSourceEgress" -}}
{{- $hosts := list }}
{{- range $src := .sources }}
{{- $hosts = concat $hosts ($src.hosts | default list) }}
{{- end }}
{{- if $hosts }}
- toFQDNs:
    {{- range $h := $hosts }}
    {{- if hasPrefix "*." $h }}
    - matchPattern: {{ $h | quote }}
    {{- else }}
    - matchName: {{ $h | quote }}
    {{- end }}
    {{- end }}
  toPorts:
    - ports:
        - port: "443"
          protocol: TCP
{{- end }}
{{- end }}
{{- define "setec.metricsScraperPeers" -}}
{{- range $c := .metricsScrapers }}
- matchLabels:
    k8s:io.kubernetes.pod.namespace: {{ $c.namespace | quote }}
    {{- toYaml (omit $c.podLabels "k8s:io.kubernetes.pod.namespace") | nindent 4 }}
{{- end }}
{{- end }}
{{- $ns := .Values.namespace }}
{{- $fn := include "setec.fullname" . }}
{{- $sp := .Values.systemPolicy }}
{{- range $c := $sp.webhookCallers }}
{{- if not (and $c.namespace $c.podLabels) }}
{{- fail "systemPolicy.webhookCallers: each entry needs a namespace and podLabels. A Pod label alone is not proof, because the person who creates a Pod chooses its labels, so the namespace of the caller is pinned too." }}
{{- end }}
{{- end }}
{{- range $c := $sp.metricsScrapers }}
{{- if not (and $c.namespace $c.podLabels) }}
{{- fail "systemPolicy.metricsScrapers: each entry needs a namespace and podLabels. A Pod label alone is not proof, because the person who creates a Pod chooses its labels, so the namespace of the scraper is pinned too." }}
{{- end }}
{{- end }}
{{- if and .Values.frontend.enabled .Values.frontend.clients (not $sp.frontendCallers) }}
{{- fail "systemPolicy.frontendCallers must not be empty when frontend.enabled=true: the namespace policy allows the frontend gRPC port only from these Pods. Name the namespace and the Pod labels of each caller (the Gibson daemon)." }}
{{- end }}
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: {{ $fn }}-{{ $ns }}-default-deny
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "Each Pod of the namespace {{ $ns }} denies all traffic, except DNS."
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: {{ $ns }}
  enableDefaultDeny:
    ingress: true
    egress: true
  ingress:
    - {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-operator
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "The operator reaches the API server and the node agents, and takes webhook calls and scrapes."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "setec.name" . }}
      app.kubernetes.io/component: operator
  egress:
    - toEntities:
        - kube-apiserver
    {{- if .Values.snapshots.enabled }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "setec.name" . }}
            app.kubernetes.io/component: node-agent
      toPorts:
        - ports:
            - port: "50052"
              protocol: TCP
    {{- end }}
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    {{- with $sp.webhookCallers }}
    - fromEndpoints:
        {{- range $c := . }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $c.namespace | quote }}
            {{- toYaml (omit $c.podLabels "k8s:io.kubernetes.pod.namespace") | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    {{- end }}
    - fromEndpoints:
        {{- include "setec.metricsScraperPeers" $sp | trim | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ .Values.metricsPort | quote }}
              protocol: TCP
{{- if .Values.frontend.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-frontend
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "The frontend takes gRPC from its callers only and reaches the API server."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "setec.name" . }}
      app.kubernetes.io/component: frontend
  egress:
    - toEntities:
        - kube-apiserver
  {{- $grpcPort := regexReplaceAll "^.*:" (toString .Values.frontend.listenAddr) "" }}
  {{- $pods := list }}
  {{- $cidrs := list }}
  {{- range $c := $sp.frontendCallers }}
  {{- if $c.cidr }}
  {{- $cidrs = append $cidrs $c.cidr }}
  {{- else }}
  {{- $pods = append $pods $c }}
  {{- end }}
  {{- end }}
  ingress:
    {{- if $pods }}
    - fromEndpoints:
        {{- range $c := $pods }}
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ required "each systemPolicy.frontendCallers entry needs a namespace or a cidr" $c.namespace }}
            {{- toYaml (required "each systemPolicy.frontendCallers entry with a namespace needs podLabels" $c.podLabels) | nindent 12 }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $grpcPort | quote }}
              protocol: TCP
    {{- end }}
    {{- if $cidrs }}
    - fromCIDR:
        {{- range $cidrs }}
        - {{ . }}
        {{- end }}
      toPorts:
        - ports:
            - port: {{ $grpcPort | quote }}
              protocol: TCP
    {{- end }}
    - fromEndpoints:
        {{- include "setec.metricsScraperPeers" $sp | trim | nindent 8 }}
      toPorts:
        - ports:
            - port: {{ .Values.frontend.metricsPort | quote }}
              protocol: TCP
{{- end }}
{{- if .Values.nodeAgent.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-node-agent
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
spec:
  description: "The node agent takes gRPC from the operator and scrapes, and reaches the snapshot store."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "setec.name" . }}
      app.kubernetes.io/component: node-agent
  ingress:
    {{- if .Values.snapshots.enabled }}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: {{ include "setec.name" . }}
            app.kubernetes.io/component: operator
      toPorts:
        - ports:
            - port: "50052"
              protocol: TCP
    {{- end }}
    - fromEndpoints:
        {{- include "setec.metricsScraperPeers" $sp | trim | nindent 8 }}
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  {{- if .Values.snapshots.enabled }}
  {{- $s3 := .Values.snapshots.s3 }}
  egress:
    {{- if $s3.endpoint }}
    {{- $u := urlParse $s3.endpoint }}
    {{- $parts := splitList ":" $u.host }}
    {{- $host := first $parts }}
    {{- $port := ternary (last $parts) (ternary "80" "443" (eq $u.scheme "http")) (gt (len $parts) 1) }}
    {{- if regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $host }}
    - toCIDR:
        - {{ printf "%s/32" $host }}
    {{- else }}
    - toFQDNs:
        - matchName: {{ $host | quote }}
    {{- end }}
      toPorts:
        - ports:
            - port: {{ $port | quote }}
              protocol: TCP
    {{- else }}
    - toFQDNs:
        - matchName: {{ printf "s3.%s.amazonaws.com" $s3.region | quote }}
        - matchName: {{ printf "%s.s3.%s.amazonaws.com" $s3.bucket $s3.region | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
  {{- end }}
{{- end }}
{{- with .Values.launcher.diskRepo }}
{{- $registry := first (splitList "/" .) }}
{{- $parts := splitList ":" $registry }}
{{- $host := first $parts }}
{{- $port := ternary (last $parts) "443" (gt (len $parts) 1) }}
{{- $isIP := regexMatch "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$" $host }}
{{- $sources := $.Values.launcher.imageSources }}
{{- if not $sources }}
{{- fail "launcher.imageSources must not be empty: the disk builder pulls each launcher image from one of these registries, and reaches no other host" }}
{{- end }}
{{- range $src := $sources }}
{{- if not $src.registry }}
{{- fail "each launcher.imageSources entry needs a registry" }}
{{- end }}
{{- if and (not $src.hosts) (not (and $isIP (eq $src.registry $registry))) }}
{{- fail (printf "launcher.imageSources entry %q needs its hosts (the registry host and the hosts that serve its blobs, which a registry such as ECR sends a download to). Only a disk registry at an IP address may list none: the disk Jobs reach it already, and it sends no download elsewhere" $src.registry) }}
{{- end }}
{{- end }}
{{- $disk := dict "isIP" $isIP "host" $host "port" $port }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-disk-builder
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
spec:
  description: "The disk build Job reaches the named image registries and the disk registry. It holds no signing seed."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: disk-builder
  egress:
    {{- include "setec.imageSourceEgress" (dict "sources" $sources) | nindent 4 }}
    {{- include "setec.diskRegistryEgress" $disk | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-disk-publisher
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
spec:
  description: "The disk publish Job reaches the disk registry only. It holds no signing seed."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: disk-publisher
  egress:
    {{- include "setec.diskRegistryEgress" $disk | nindent 4 }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ $fn }}-image-verify
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
spec:
  description: "The image verify Job reaches the named image registries and the Sigstore trust root."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: image-verify
  egress:
    {{- include "setec.imageSourceEgress" (dict "sources" $sources) | nindent 4 }}
    {{- range $src := $sources }}
    {{- if eq $src.registry $registry }}
    {{- include "setec.diskRegistryEgress" $disk | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- with $sp.sigstoreHosts }}
    - toFQDNs:
        {{- range . }}
        - matchName: {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- end }}
{{- end }}
