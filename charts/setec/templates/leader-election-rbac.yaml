{{- if .Values.leaderElect }}
# controller-runtime leader election holds a single Lease in the operator's
# own namespace. leaderElect defaults true (values.yaml), and deployment.yaml
# passes --leader-elect accordingly, but no RBAC granted access to
# coordination.k8s.io/leases — so the manager failed leader election
# ("leases.coordination.k8s.io is forbidden") and exited, crashlooping. This
# namespaced Role (not the cluster-scoped -manager ClusterRole) keeps the
# grant least-privilege: one namespace, the lease and its leader-election
# events only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "setec.fullname" . }}-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "setec.fullname" . }}-leader-election
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "setec.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "setec.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
