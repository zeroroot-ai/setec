{{- if .Values.frontend.enabled -}}
{{- if eq .Values.credentials.mode "file" -}}
{{- if not .Values.frontend.tlsCertSecretName -}}
{{- fail "frontend.tlsCertSecretName is required when frontend.enabled=true in file mode; the frontend requires mTLS." -}}
{{- end -}}
{{- if not .Values.frontend.tlsClientCASecretName -}}
{{- fail "frontend.tlsClientCASecretName is required when frontend.enabled=true in file mode; the frontend requires mTLS (client-cert verification)." -}}
{{- end -}}
{{- end -}}
{{- if not .Values.frontend.clients -}}
{{- fail "frontend.clients must not be empty when frontend.enabled=true: the frontend refuses every caller that is not an enrolled client, so an install with no client serves nobody. Add one {name, spiffeID or spiffePath} entry for each Gibson cluster." -}}
{{- end -}}
{{- range .Values.frontend.clients -}}
{{- if not .name -}}
{{- fail "each entry of frontend.clients needs a name, and a spiffeID or a spiffePath" -}}
{{- end -}}
{{- $_ := include "setec.clientSPIFFEID" (dict "client" . "root" $) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "setec.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "setec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "setec.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "setec.fullname" . }}-frontend
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          args:
            - --listen-addr={{ .Values.frontend.listenAddr }}
            - --metrics-addr=:{{ .Values.frontend.metricsPort }}
            {{- range .Values.frontend.clients }}
            - --client={{ .name }}={{ include "setec.clientSPIFFEID" (dict "client" . "root" $) }}
            {{- end }}
            # The RoleBindings of each pair namespace that the frontend
            # makes: Pod writes for the operator, exec for the frontend.
            - --pair-namespace-grant={{ include "setec.fullname" . }}-sandbox-namespace={{ .Values.namespace }}/{{ include "setec.serviceAccountName" . }}
            - --pair-namespace-grant={{ include "setec.fullname" . }}-frontend-exec={{ .Values.namespace }}/{{ include "setec.fullname" . }}-frontend
            {{- if eq .Values.credentials.mode "spiffe" }}
            - --spiffe-socket={{ .Values.credentials.spiffe.socketPath }}
            {{- else }}
            - --tls-cert=/etc/setec/tls/tls.crt
            - --tls-key=/etc/setec/tls/tls.key
            - --tls-client-ca=/etc/setec/tls-ca/ca.crt
            {{- end }}
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.frontend.metricsPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- if eq .Values.credentials.mode "spiffe" }}
            - name: spiffe-workload-api
              mountPath: {{ dir .Values.credentials.spiffe.socketPath }}
              readOnly: true
            {{- else }}
            - name: tls
              mountPath: /etc/setec/tls
              readOnly: true
            - name: tls-ca
              mountPath: /etc/setec/tls-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq .Values.credentials.mode "spiffe" }}
        {{- /* The socket's directory, not the socket file: the SPIRE agent
        recreates the socket on restart, and a hostPath to the file would
        pin the old inode. Directory (not DirectoryOrCreate) so a node
        without a Workload API fails Pod creation loudly instead of
        booting a frontend that can never fetch an SVID. */}}
        - name: spiffe-workload-api
          hostPath:
            path: {{ dir .Values.credentials.spiffe.socketPath }}
            type: Directory
        {{- else }}
        - name: tls
          secret:
            secretName: {{ .Values.frontend.tlsCertSecretName }}
        - name: tls-ca
          secret:
            secretName: {{ .Values.frontend.tlsClientCASecretName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "setec.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "setec.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - name: grpc
      port: {{ .Values.frontend.servicePort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.frontend.metricsPort }}
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "setec.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "setec.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "setec.fullname" . }}-frontend
  labels:
    {{- include "setec.labels" . | nindent 4 }}
rules:
  # patch: the frontend stamps the last-activity annotation on session
  # Sandboxes (Attach + stream heartbeats) so the operator's idle
  # eviction can tell an active session from an abandoned one, and
  # flips spec.desiredState to Running when an Exec arrives for a
  # paused or suspended session (docs/design/lifecycles.md auto-resume). Both are
  # narrow merge patches; the frontend never writes status.
  - apiGroups: ["setec.zeroroot.ai"]
    resources: [sandboxes]
    verbs: [create, delete, get, list, patch, watch]
  # read: Suspend checks that the class of a session has checkpoints
  # (setec#193), and the lease service reads the pool class.
  - apiGroups: ["setec.zeroroot.ai"]
    resources: [sandboxclasses]
    verbs: [get, list, watch]
  # Fork and Keep wait for the Snapshot they asked for, Pin writes
  # spec.pinned of a kept Snapshot, and a review launch reads it
  # (setec#195, setec#196). The admission webhook holds the pin limit.
  - apiGroups: ["setec.zeroroot.ai"]
    resources: [snapshots]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  # The namespace of each pair of client and tenant (setec#207). The
  # frontend makes it on the first call of the pair, with two
  # RoleBindings in it. The ValidatingAdmissionPolicy -frontend-scope
  # limits both writes: a namespace only with the sandbox labels and the
  # sbx- prefix, a RoleBinding only in such a namespace and only of the
  # two roles below.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [rolebindings]
    verbs: [create]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames:
      - {{ include "setec.fullname" . }}-sandbox-namespace
      - {{ include "setec.fullname" . }}-frontend-exec
  # Reads stay cluster-wide: the frontend resolves a Sandbox to its Pod
  # and streams that Pod's log. Neither verb enters a container.
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "setec.fullname" . }}-frontend
  labels:
    {{- include "setec.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "setec.fullname" . }}-frontend
subjects:
  - kind: ServiceAccount
    name: {{ include "setec.fullname" . }}-frontend
    namespace: {{ .Values.namespace }}
---
{{- /*
=============================================================================
Where the frontend is allowed to ENTER a Pod.
=============================================================================

`SandboxService.Exec` runs a command inside an already-running session's
workload container, so the frontend needs `pods/exec: create`. That verb
is a pod-entry grant: the holder steps into a process that already has
its ServiceAccount token, its mounted Secrets and, on this platform, its
SPIFFE SVID. No admission policy runs on a subresource, so the binding
scope is the whole of the control.

Sandbox Pods only ever run in the namespaces named in `sandboxNamespaces`,
so the grant is RoleBound into exactly those namespaces and is
never cluster-wide. A namespace that holds a platform identity is
therefore out of reach.

Upstream setec v0.113.0 put this rule in the cluster-wide `-frontend`
ClusterRole above. deploy narrows it here and carries the same split
upstream (setec#383). It mirrors the operator's own Pod-write split in
sandbox-namespace-rbac.yaml, including the explicit cluster-wide escape
hatch for a dynamic Sandbox-namespace scheme.
*/ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "setec.fullname" . }}-frontend-exec
  labels:
    {{- include "setec.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
{{- if .Values.rbac.allowClusterWideSandboxWrite }}
---
# EXPLICIT cluster-wide grant, chosen by setting
# rbac.allowClusterWideSandboxWrite: true. This lets the frontend exec into
# ANY Pod in the cluster, which reaches every platform identity if the
# frontend is compromised. Prefer listing sandboxNamespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "setec.fullname" . }}-frontend-exec
  labels:
    {{- include "setec.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "setec.fullname" . }}-frontend-exec
subjects:
  - kind: ServiceAccount
    name: {{ include "setec.fullname" . }}-frontend
    namespace: {{ .Values.namespace }}
{{- else }}
{{- range $ns := .Values.sandboxNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "setec.fullname" $ }}-frontend-exec
  namespace: {{ $ns }}
  labels:
    {{- include "setec.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "setec.fullname" $ }}-frontend-exec
subjects:
  - kind: ServiceAccount
    name: {{ include "setec.fullname" $ }}-frontend
    namespace: {{ $.Values.namespace }}
{{- end }}
{{- end }}
{{- end }}
